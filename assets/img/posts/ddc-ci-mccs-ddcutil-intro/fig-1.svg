<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 622" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 1．PC 經 DDC／CI 讀 EDID 與讀寫 VCP 的時序</title>
<desc>PC 經 I²C 讀 EDID（0x50），再經 DDC／CI（0x37）讀寫 VCP 0x10。韌體更新背光、同步 OSD，並延遲寫入 flash。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="frames"></g><g id="lifelines"><line x1="159.3" y1="80.0" x2="159.3" y2="590.0" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="430.0" y1="80.0" x2="430.0" y2="590.0" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="700.7" y1="80.0" x2="700.7" y2="590.0" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4 4"/></g><g id="actor-pc"><rect x="32.0" y="24.0" width="254.7" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="159.3" y="43.0" text-anchor="middle" dominant-baseline="central">PC／測試腳本</text><text x="159.3" y="61.0" text-anchor="middle" dominant-baseline="central">（ddcutil）</text></g><g id="actor-bus"><rect x="302.7" y="24.0" width="254.7" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="430.0" y="43.0" text-anchor="middle" dominant-baseline="central">I²C（DDC）</text><text x="430.0" y="61.0" text-anchor="middle" dominant-baseline="central">I²C-over-AUX（DP）</text></g><g id="actor-fw"><rect x="573.3" y="24.0" width="254.7" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="700.7" y="43.0" text-anchor="middle" dominant-baseline="central">顯示器韌體</text><text x="700.7" y="61.0" text-anchor="middle" dominant-baseline="central">（scaler MCU）</text></g><g id="msg-0"><line x1="167.3" y1="138.0" x2="422.0" y2="138.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="294.7" y="116.0" text-anchor="middle" dominant-baseline="central" class="mono">讀 EDID（0x50）</text></g><g id="msg-1"><line x1="422.0" y1="194.0" x2="167.3" y2="194.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="294.7" y="172.0" text-anchor="middle" dominant-baseline="central" class="mono">EDID 128／256 bytes</text></g><g id="msg-2"><line x1="167.3" y1="270.0" x2="422.0" y2="270.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="294.7" y="228.0" text-anchor="middle" dominant-baseline="central" class="mono">DDC／CI Get VCP 0x10（to</text><text x="294.7" y="248.0" text-anchor="middle" dominant-baseline="central" class="mono">0x37）</text></g><g id="msg-3"><line x1="438.0" y1="326.0" x2="692.7" y2="326.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="565.3" y="304.0" text-anchor="middle" dominant-baseline="central">轉送命令</text></g><g id="msg-4"><line x1="692.7" y1="382.0" x2="167.3" y2="382.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="430.0" y="360.0" text-anchor="middle" dominant-baseline="central">回覆：目前值／最大值</text></g><g id="msg-5"><line x1="167.3" y1="438.0" x2="422.0" y2="438.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="294.7" y="416.0" text-anchor="middle" dominant-baseline="central" class="mono">DDC／CI Set VCP 0x10＝50</text></g><g id="msg-6"><line x1="438.0" y1="494.0" x2="692.7" y2="494.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="565.3" y="472.0" text-anchor="middle" dominant-baseline="central">轉送命令</text></g><g id="self-7"><text x="700.7" y="528.0" text-anchor="middle" dominant-baseline="central">更新背光、同步 OSD 顯示、</text><text x="700.7" y="548.0" text-anchor="middle" dominant-baseline="central">延遲寫入 flash</text><path d="M 700.7 574.0 C 746.7 584.0, 746.7 602.0, 700.7 596.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g>
</svg>
