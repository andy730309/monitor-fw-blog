<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 2．ddcutil 存取的兩個 I²C 位址</title>
<desc>0x50 讀 EDID，0x37 走 DDC／CI 控制背光、PQ、輸入與 OSD。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="addrs"><g id="node-pc"><rect x="28.0" y="110.0" width="180.0" height="72.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="118.0" y="137.0" text-anchor="middle" dominant-baseline="central">PC</text><text x="118.0" y="155.0" text-anchor="middle" dominant-baseline="central">（ddcutil）</text></g><g id="node-edid"><rect x="340.0" y="36.0" width="230.0" height="78.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="455.0" y="66.0" text-anchor="middle" dominant-baseline="central" class="mono">0x50</text><text x="455.0" y="84.0" text-anchor="middle" dominant-baseline="central">EDID EEPROM／FW</text></g><g id="node-sfw"><rect x="340.0" y="176.0" width="230.0" height="78.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="455.0" y="206.0" text-anchor="middle" dominant-baseline="central" class="mono">0x37</text><text x="455.0" y="224.0" text-anchor="middle" dominant-baseline="central">Scaler FW</text></g><g id="node-out"><rect x="620.0" y="168.0" width="176.0" height="94.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="708.0" y="197.0" text-anchor="middle" dominant-baseline="central">背光／PQ</text><text x="708.0" y="215.0" text-anchor="middle" dominant-baseline="central">輸入切換</text><text x="708.0" y="233.0" text-anchor="middle" dominant-baseline="central">OSD 同步</text></g><g id="link-edid"><line x1="208.0" y1="130.0" x2="340.0" y2="74.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="274.0" y="92.0" text-anchor="middle" dominant-baseline="central" class="secondary">I²C／DDC</text></g><g id="link-ci"><line x1="208.0" y1="162.0" x2="340.0" y2="210.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="274.0" y="198.0" text-anchor="middle" dominant-baseline="central" class="secondary">DDC／CI</text></g><g id="link-out"><line x1="570.0" y1="215.0" x2="620.0" y2="215.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g></g>
</svg>
