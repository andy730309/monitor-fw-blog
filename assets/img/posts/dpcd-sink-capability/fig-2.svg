 fill="var(--bg-highlight)" stroke="var(--border-color)" stroke-width="1.5"/><text x="450.0" y="105.0" text-anchor="middle" dominant-baseline="central">承圖 1（連結不穩或首次插入）</text></g><g id="msg-2"><line x1="174.0" y1="196.0" x2="726.0" y2="196.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="450.0" y="174.0" text-anchor="middle" dominant-baseline="central" class="mono">送出 TPS1（Main Link）</text></g><g id="msg-3"><line x1="174.0" y1="272.0" x2="442.0" y2="272.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="308.0" y="230.0" text-anchor="middle" dominant-baseline="central" class="mono">Read 00202h–00203h（Lane</text><text x="308.0" y="250.0" text-anchor="middle" dominant-baseline="central" class="mono">Status）</text></g><g id="msg-4"><line x1="442.0" y1="328.0" x2="174.0" y2="328.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="308.0" y="306.0" text-anchor="middle" dominant-baseline="central" class="mono">LANEx_CR_DONE</text></g><g id="msg-6"><line x1="174.0" y1="402.0" x2="442.0" y2="402.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="308.0" y="380.0" text-anchor="middle" dominant-baseline="central" class="mono">Write 00102h（TPS2／3／4）</text></g><g id="msg-8"><line x1="174.0" y1="484.0" x2="726.0" y2="484.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="450.0" y="462.0" text-anchor="middle" dominant-baseline="central" class="mono">送出 TPS2／3／4（Main Link）</text></g><g id="msg-9"><line x1="174.0" y1="540.0" x2="442.0" y2="540.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="308.0" y="518.0" text-anchor="middle" dominant-baseline="central" class="mono">Read 00202h–00204h</text></g><g id="msg-10"><line x1="442.0" y1="636.0" x2="174.0" y2="636.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="308.0" y="574.0" text-anchor="middle" dominant-baseline="central" class="mono">CHANNEL_EQ_DONE、</text><text x="308.0" y="594.0" text-anchor="middle" dominant-baseline="central" class="mono">SYMBOL_LOCKED、</text><text x="308.0" y="614.0" text-anchor="middle" dominant-baseline="central" class="mono">INTERLANE_ALIGN_DONE</text></g><g id="msg-12"><line x1="174.0" y1="730.0" x2="442.0" y2="730.0" fill="none" stroke="var(--status-ok)" stroke-width="2" marker-end="url(#arrow)"/><text x="308.0" y="688.0" text-anchor="middle" dominant-baseline="central" class="mono">Write 00102h＝00h（training</text><text x="308.0" y="708.0" text-anchor="middle" dominant-baseline="central" class="mono">結束）</text></g><g id="note-13"><rect x="32.0" y="754.0" width="836.0" height="30.0" rx="6" fill="var(--bg-highlight)" stroke="var(--border-color)" stroke-width="1.5"/><text x="450.0" y="771.0" text-anchor="middle" dominant-baseline="central">開始傳送影像（Main Link）</text></g>
</svg>
