<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1040" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 1．HPD 後讀取能力並設定 link（8b／10b）</title>
<desc>HPD 後先讀 00200h。連結不穩或首次插入才讀 Receiver Capability，必要時讀 02200h，再寫 link 設定與 TPS1。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="frames"><rect x="30.0" y="468.0" width="840.0" height="178.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="38.0" y="458.0" width="229.2" height="20" rx="4" fill="var(--bg-highlight)" stroke="var(--border-color)" stroke-width="1"/><text x="152.6" y="468.0" text-anchor="middle" dominant-baseline="central" class="secondary">0000Eh bit 7＝1（DPCD r1.4＋）</text><rect x="30.0" y="290.0" width="840.0" height="708.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="38.0" y="280.0" width="135.3" height="20" rx="4" fill="var(--bg-highlight)" stroke="var(--border-color)" stroke-width="1"/><text x="105.7" y="290.0" text-anchor="middle" dominant-baseline="central" class="secondary">連結不穩或首次插入</text></g><g id="lifelines"><line x1="166.0" y1="62.0" x2="166.0" y2="1008.0" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="450.0" y1="62.0" x2="450.0" y2="1008.0" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="734.0" y1="62.0" x2="734.0" y2="1008.0" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4 4"/></g><g id="actor-src"><rect x="32.0" y="24.0" width="268.0" height="38.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="166.0" y="43.0" text-anchor="middle" dominant-baseline="central">Source</text></g><g id="actor-aux"><rect x="316.0" y="24.0" width="268.0" height="38.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="450.0" y="43.0" text-anchor="middle" dominant-baseline="central">AUX</text></g><g id="actor-sink"><rect x="600.0" y="24.0" width="268.0" height="38.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="734.0" y="43.0" text-anchor="middle" dominant-baseline="central">Sink</text></g><g id="note-0"><rect x="32.0" y="88.0" width="836.0" height="30.0" rx="6" fill="var(--bg-highlight)" stroke="var(--border-color)" stroke-width="1.5"/><text x="450.0" y="105.0" text-anchor="middle" dominant-baseline="central">HPD 插入／重新插入</text></g><g id="msg-1"><line x1="174.0" y1="190.0" x2="442.0" y2="190.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="308.0" y="148.0" text-anchor="middle" dominant-baseline="central" class="mono">Read 00200h–00205h（Link／</text><text x="308.0" y="168.0" text-anchor="middle" dominant-baseline="central" class="mono">Sink Status）</text></g><g id="msg-2"><line x1="442.0" y1="266.0" x2="174.0" y2="266.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="308.0" y="224.0" text-anchor="middle" dominant-baseline="central" class="mono">SINK_COUNT、LANEx_STATUS、</text><text x="308.0" y="244.0" text-anchor="middle" dominant-baseline="central" class="mono">LANE_ALIGN_STATUS</text></g><g id="msg-4"><line x1="174.0" y1="368.0" x2="442.0" y2="368.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="308.0" y="326.0" text-anchor="middle" dominant-baseline="central" class="mono">Read 00000h–0000Fh（Receiver</text><text x="308.0" y="346.0" text-anchor="middle" dominant-baseline="central" class="mono">Capability）</text></g><g id="msg-5"><line x1="442.0" y1="444.0" x2="174.0" y2="444.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="308.0" y="402.0" text-anchor="middle" dominant-baseline="central" class="mono">MAX_LINK_RATE、MAX_LANE_COUNT、</text><text x="308.0" y="422.0" text-anchor="middle" dominant-baseline="central" class="mono">ENHANCED_FRAME_CAP</text></g><g id="msg-7"><line x1="174.0" y1="546.0" x2="442.0" y2="546.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="308.0" y="504.0" text-anchor="middle" dominant-baseline="central" class="mono">Read 02200h–（Extended</text><text x="308.0" y="524.0" text-anchor="middle" dominant-baseline="central" class="mono">Receiver Cap）</text></g><g id="msg-8"><line x1="442.0" y1="622.0" x2="174.0" y2="622.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="308.0" y="580.0" text-anchor="middle" dominant-baseline="central" class="mono">真實能力、128b／132b（02206h）、</text><text x="308.0" y="600.0" text-anchor="middle" dominant-baseline="central" class="mono">UHBR（02215h）</text></g><g id="msg-10"><line x1="174.0" y1="696.0" x2="442.0" y2="696.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="308.0" y="674.0" text-anchor="middle" dominant-baseline="central" class="mono">Write 00100h（LINK_BW_SET）</text></g><g id="msg-11"><line x1="174.0" y1="752.0" x2="442.0" y2="752.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="308.0" y="730.0" text-anchor="middle" dominant-baseline="central" class="mono">Write 00101h（LANE_COUNT_SET）</text></g><g id="msg-12"><line x1="174.0" y1="848.0" x2="442.0" y2="848.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="308.0" y="786.0" text-anchor="middle" dominant-baseline="central" class="mono">Write 00107h／</text><text x="308.0" y="806.0" text-anchor="middle" dominant-baseline="central" class="mono">00108h（DOWNSPREAD_CTRL／</text><text x="308.0" y="826.0" text-anchor="middle" dominant-baseline="central" class="mono">MAIN_LINK_CHANNEL_CODING_SET）</text></g><g id="msg-13"><line x1="174.0" y1="924.0" x2="442.0" y2="924.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="308.0" y="882.0" text-anchor="middle" dominant-baseline="central" class="mono">Write 00102h＝21h（TPS1，</text><text x="308.0" y="902.0" text-anchor="middle" dominant-baseline="central" class="mono">scrambling off）</text></g><g id="note-14"><rect x="32.0" y="948.0" width="836.0" height="30.0" rx="6" fill="var(--bg-highlight)" stroke="var(--border-color)" stroke-width="1.5"/><text x="450.0" y="965.0" text-anchor="middle" dominant-baseline="central">接圖 2：Link Training</text></g>
</svg>
