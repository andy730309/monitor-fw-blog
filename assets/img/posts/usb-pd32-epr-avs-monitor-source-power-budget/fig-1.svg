<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 954" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 1．EPR 進入與線材檢查時序</title>
<desc>Sink 送 EPR_Mode_Enter 之後，非帶線產品要先向線材確認 50V／5A，Source 才送 Enter Succeeded。之後週期 KeepAlive。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="frames"><rect x="30.0" y="268.0" width="820.0" height="138.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="38.0" y="258.0" width="188.4" height="20" rx="4" fill="var(--bg-highlight)" stroke="var(--border-color)" stroke-width="1"/><text x="132.2" y="268.0" text-anchor="middle" dominant-baseline="central" class="secondary">非帶線產品才做；帶線可略過</text><rect x="30.0" y="724.0" width="820.0" height="138.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="38.0" y="714.0" width="111.4" height="20" rx="4" fill="var(--bg-highlight)" stroke="var(--border-color)" stroke-width="1"/><text x="93.7" y="724.0" text-anchor="middle" dominant-baseline="central" class="secondary">重複：EPR 期間</text></g><g id="lifelines"><line x1="162.7" y1="80.0" x2="162.7" y2="922.0" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="440.0" y1="80.0" x2="440.0" y2="922.0" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="717.3" y1="80.0" x2="717.3" y2="922.0" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4 4"/></g><g id="actor-sink"><rect x="32.0" y="24.0" width="261.3" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="162.7" y="52.0" text-anchor="middle" dominant-baseline="central">Sink</text></g><g id="actor-src"><rect x="309.3" y="24.0" width="261.3" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="440.0" y="43.0" text-anchor="middle" dominant-baseline="central">Source</text><text x="440.0" y="61.0" text-anchor="middle" dominant-baseline="central">（monitor）</text></g><g id="actor-cable"><rect x="586.7" y="24.0" width="261.3" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="717.3" y="52.0" text-anchor="middle" dominant-baseline="central">cable</text></g><g id="note-0"><rect x="32.0" y="106.0" width="816.0" height="30.0" rx="6" fill="var(--bg-highlight)" stroke="var(--border-color)" stroke-width="1.5"/><text x="440.0" y="123.0" text-anchor="middle" dominant-baseline="central">前提：已有 SPR explicit contract，雙方已宣告 EPR Mode Capable</text></g><g id="msg-1"><line x1="170.7" y1="188.0" x2="432.0" y2="188.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="301.3" y="166.0" text-anchor="middle" dominant-baseline="central" class="mono">EPR_Mode_Enter</text></g><g id="msg-2"><line x1="432.0" y1="244.0" x2="170.7" y2="244.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="301.3" y="222.0" text-anchor="middle" dominant-baseline="central" class="mono">EPR_Mode_Enter Acknowledged</text></g><g id="msg-4"><line x1="448.0" y1="326.0" x2="709.3" y2="326.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="578.7" y="304.0" text-anchor="middle" dominant-baseline="central" class="mono">Discover Identity（SOP'）</text></g><g id="msg-5"><line x1="709.3" y1="382.0" x2="448.0" y2="382.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="578.7" y="360.0" text-anchor="middle" dominant-baseline="central" class="mono">50V／5A 宣告</text></g><g id="msg-7"><line x1="432.0" y1="456.0" x2="170.7" y2="456.0" fill="none" stroke="var(--status-ok)" stroke-width="2" marker-end="url(#arrow)"/><text x="301.3" y="434.0" text-anchor="middle" dominant-baseline="central" class="mono">EPR_Mode_Enter Succeeded</text></g><g id="msg-8"><line x1="432.0" y1="532.0" x2="170.7" y2="532.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="301.3" y="490.0" text-anchor="middle" dominant-baseline="central" class="mono">EPR_Source_Capabilities（PDO</text><text x="301.3" y="510.0" text-anchor="middle" dominant-baseline="central" class="mono">1–7 SPR、8–13 EPR）</text></g><g id="msg-9"><line x1="170.7" y1="588.0" x2="432.0" y2="588.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="301.3" y="566.0" text-anchor="middle" dominant-baseline="central" class="mono">EPR_Request</text></g><g id="msg-10"><line x1="432.0" y1="644.0" x2="170.7" y2="644.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="301.3" y="622.0" text-anchor="middle" dominant-baseline="central" class="mono">Accept</text></g><g id="msg-11"><line x1="432.0" y1="700.0" x2="170.7" y2="700.0" fill="none" stroke="var(--status-ok)" stroke-width="2" marker-end="url(#arrow)"/><text x="301.3" y="678.0" text-anchor="middle" dominant-baseline="central" class="mono">PS_RDY</text></g><g id="msg-13"><line x1="170.7" y1="782.0" x2="432.0" y2="782.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="301.3" y="760.0" text-anchor="middle" dominant-baseline="central" class="mono">EPR_KeepAlive</text></g><g id="msg-14"><line x1="432.0" y1="838.0" x2="170.7" y2="838.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="301.3" y="816.0" text-anchor="middle" dominant-baseline="central" class="mono">KeepAlive_ACK</text></g><g id="note-16"><rect x="32.0" y="880.0" width="816.0" height="30.0" rx="6" fill="var(--bg-highlight)" stroke="var(--border-color)" stroke-width="1.5"/><text x="440.0" y="897.0" text-anchor="middle" dominant-baseline="central">Source 約 1 秒沒收到訊息就 Hard Reset（此 1 秒出自 TI 簡報，不是 Enter 流程本身的步驟）</text></g>
</svg>
