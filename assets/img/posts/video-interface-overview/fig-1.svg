<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 720" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 1．介面家族樹與向下相容關係</title>
<desc>VGA 到 HDMI 是被動轉接。DP 可以用 DP++ 被動轉到 DVI-D 或 HDMI。USB-C 的 DP Alt Mode 不支援 DP++，接到 HDMI 要主動轉換器。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="legend"><g id="leg-old"><rect x="20.0" y="16.0" width="190.0" height="36.0" rx="6" fill="var(--bg-node)" stroke="var(--status-warn)" stroke-width="1.5"/><text x="115.0" y="34.0" text-anchor="middle" dominant-baseline="central">已淘汰／少見</text></g><g id="leg-hdmi"><rect x="224.0" y="16.0" width="190.0" height="36.0" rx="6" fill="var(--bg-node)" stroke="var(--status-ok)" stroke-width="1.5"/><text x="319.0" y="34.0" text-anchor="middle" dominant-baseline="central">消費電子主流</text></g><g id="leg-dp"><rect x="428.0" y="16.0" width="190.0" height="36.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="523.0" y="34.0" text-anchor="middle" dominant-baseline="central">PC／專業主流</text></g><g id="leg-usbc"><rect x="632.0" y="16.0" width="208.0" height="36.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="736.0" y="34.0" text-anchor="middle" dominant-baseline="central">現代單一埠</text></g></g><g id="node-vga"><rect x="20.0" y="72.0" width="210.0" height="60.0" rx="6" fill="var(--bg-node)" stroke="var(--status-warn)" stroke-width="1.5"/><text x="125.0" y="93.0" text-anchor="middle" dominant-baseline="central">VGA 1987</text><text x="125.0" y="111.0" text-anchor="middle" dominant-baseline="central">Analog RGB</text></g><g id="node-dvii"><rect x="20.0" y="176.0" width="210.0" height="60.0" rx="6" fill="var(--bg-node)" stroke="var(--status-warn)" stroke-width="1.5"/><text x="125.0" y="197.0" text-anchor="middle" dominant-baseline="central">DVI-I</text><text x="125.0" y="215.0" text-anchor="middle" dominant-baseline="central">Digital＋Analog</text></g><g id="node-dvid"><rect x="20.0" y="280.0" width="210.0" height="60.0" rx="6" fill="var(--bg-node)" stroke="var(--status-warn)" stroke-width="1.5"/><text x="125.0" y="301.0" text-anchor="middle" dominant-baseline="central">DVI-D</text><text x="125.0" y="319.0" text-anchor="middle" dominant-baseline="central">Digital Only</text></g><g id="node-hdmi"><rect x="20.0" y="400.0" width="210.0" height="68.0" rx="6" fill="var(--bg-node)" stroke="var(--status-ok)" stroke-width="1.5"/><text x="125.0" y="425.0" text-anchor="middle" dominant-baseline="central">HDMI 1.x／2.0</text><text x="125.0" y="443.0" text-anchor="middle" dominant-baseline="central">TMDS＋Audio＋CEC</text></g><g id="vga-dvii"><line x1="125.0" y1="132.0" x2="125.0" y2="176.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="150.0" y="154.0" text-anchor="start" dominant-baseline="central" class="secondary">被動轉接</text><g id="dvii-dvid"><line x1="125.0" y1="236.0" x2="125.0" y2="280.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="150.0" y="258.0" text-anchor="start" dominant-baseline="central" class="secondary">被動轉接</text><g id="dvid-hdmi"><line x1="125.0" y1="340.0" x2="125.0" y2="400.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="150.0" y="370.0" text-anchor="start" dominant-baseline="central" class="secondary">被動轉接，電氣相容</text><g id="node-dp"><rect x="330.0" y="250.0" width="220.0" height="72.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="440.0" y="277.0" text-anchor="middle" dominant-baseline="central">DisplayPort 1.0＋</text><text x="440.0" y="295.0" text-anchor="middle" dominant-baseline="central">Packet＋AUX</text></g><g id="dp-dvid"><line x1="330.0" y1="286.0" x2="230.0" y2="310.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="280.0" y="236.0" text-anchor="middle" dominant-baseline="central" class="secondary">DP++ 被動轉接</text><g id="dp-hdmi"><path d="M 440.0 322.0 L 440.0 434.0 L 230.0 434.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="360.0" y="420.0" text-anchor="middle" dominant-baseline="central" class="secondary">DP++ 被動轉接</text><g id="node-usbc"><rect x="620.0" y="250.0" width="220.0" height="72.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="730.0" y="286.0" text-anchor="middle" dominant-baseline="central">USB-C 連接器</text></g><g id="node-tbt"><rect x="620.0" y="390.0" width="220.0" height="68.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="730.0" y="415.0" text-anchor="middle" dominant-baseline="central">Thunderbolt 3／4／5</text><text x="730.0" y="433.0" text-anchor="middle" dominant-baseline="central">PCIe＋DP Tunneling</text></g><g id="node-hdmialt"><rect x="620.0" y="520.0" width="220.0" height="64.0" rx="6" fill="var(--bg-highlight)" stroke="var(--status-warn)" stroke-width="1.5"/><text x="730.0" y="543.0" text-anchor="middle" dominant-baseline="central">HDMI Alt Mode</text><text x="730.0" y="561.0" text-anchor="middle" dominant-baseline="central">（已停更）</text></g><g id="node-dpalt"><rect x="330.0" y="520.0" width="230.0" height="64.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="445.0" y="543.0" text-anchor="middle" dominant-baseline="central">DP Alt Mode</text><text x="445.0" y="561.0" text-anchor="middle" dominant-baseline="central">pin C／D／E</text></g><g id="usbc-tbt"><line x1="730.0" y1="322.0" x2="730.0" y2="390.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="748.0" y="356.0" text-anchor="start" dominant-baseline="central" class="secondary">Thunderbolt</text><g id="usbc-dpalt"><path d="M 620.0 300.0 L 580.0 300.0 L 580.0 552.0 L 560.0 552.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="470.0" y="500.0" text-anchor="middle" dominant-baseline="central" class="secondary">Alt Mode</text><g id="usbc-hdmialt"><path d="M 840.0 270.0 L 848.0 270.0 L 848.0 500.0 L 790.0 500.0 L 790.0 520.0" fill="none" stroke="var(--status-warn)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="700.0" y="486.0" text-anchor="middle" dominant-baseline="central" class="warn">已停更</text><g id="alt-to-hdmi"><path d="M 330.0 552.0 L 125.0 552.0 L 125.0 468.0" fill="none" stroke="var(--status-warn)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><text x="230.0" y="536.0" text-anchor="middle" dominant-baseline="central" class="warn">不支援 DP++</text><text x="230.0" y="574.0" text-anchor="middle" dominant-baseline="central" class="warn">需主動轉換器</text>
</svg>
