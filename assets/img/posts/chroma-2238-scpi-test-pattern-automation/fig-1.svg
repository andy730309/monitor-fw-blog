<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 1．三個 gate：把就緒變成可觀測條件</title>
<desc>RUN TIM 之後過 Gate 1，RUN PTN 之後過 Gate 2 與 Gate 3，才寫入結果。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="step-tim"><rect x="80.0" y="36.0" width="560.0" height="70.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="360.0" y="62.0" text-anchor="middle" dominant-baseline="central">送出</text><text x="360.0" y="80.0" text-anchor="middle" dominant-baseline="central" class="mono">RUN TIM</text></g><g id="gate-1"><rect x="80.0" y="130.0" width="560.0" height="70.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="360.0" y="156.0" text-anchor="middle" dominant-baseline="central">Gate 1</text><text x="360.0" y="174.0" text-anchor="middle" dominant-baseline="central">DDC／CI 心跳成功（DUT 可服務）</text></g><g id="step-ptn"><rect x="80.0" y="224.0" width="560.0" height="70.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="360.0" y="250.0" text-anchor="middle" dominant-baseline="central">送出</text><text x="360.0" y="268.0" text-anchor="middle" dominant-baseline="central" class="mono">RUN PTN</text></g><g id="gate-2"><rect x="80.0" y="318.0" width="560.0" height="70.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="360.0" y="344.0" text-anchor="middle" dominant-baseline="central">Gate 2</text><text x="360.0" y="362.0" text-anchor="middle" dominant-baseline="central">DDC／CI 心跳仍成功（保守確認）</text></g><g id="gate-3"><rect x="80.0" y="412.0" width="560.0" height="70.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="360.0" y="438.0" text-anchor="middle" dominant-baseline="central">Gate 3</text><text x="360.0" y="456.0" text-anchor="middle" dominant-baseline="central">量測值連續收斂（畫面真的穩了）</text></g><g id="step-write"><rect x="80.0" y="506.0" width="560.0" height="70.0" rx="6" fill="var(--bg-node)" stroke="var(--status-ok)" stroke-width="1.5"/><text x="360.0" y="532.0" text-anchor="middle" dominant-baseline="central">寫入結果</text><text x="360.0" y="550.0" text-anchor="middle" dominant-baseline="central" class="mono">timing／pattern／module／serial／fw hash</text></g><line x1="360.0" y1="106.0" x2="360.0" y2="130.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><line x1="360.0" y1="200.0" x2="360.0" y2="224.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><line x1="360.0" y1="294.0" x2="360.0" y2="318.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><line x1="360.0" y1="388.0" x2="360.0" y2="412.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><line x1="360.0" y1="482.0" x2="360.0" y2="506.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
