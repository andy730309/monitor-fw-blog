<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 1．DP 經 USB4 tunnel 到螢幕的兩段 link</title>
<desc>GPU 到 DP IN 是第一段 DP，中間是 USB4 tunnel，DP OUT 到螢幕是第二段 DP。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="node-gpu"><rect x="24.0" y="70.0" width="150.0" height="72.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="99.0" y="97.0" text-anchor="middle" dominant-baseline="central">GPU</text><text x="99.0" y="115.0" text-anchor="middle" dominant-baseline="central" class="mono">DPTX</text></g><g id="node-in"><rect x="250.0" y="56.0" width="190.0" height="100.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="345.0" y="97.0" text-anchor="middle" dominant-baseline="central">DP IN Adapter</text><text x="345.0" y="115.0" text-anchor="middle" dominant-baseline="central">（host router）</text></g><g id="node-out"><rect x="500.0" y="56.0" width="190.0" height="100.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="595.0" y="97.0" text-anchor="middle" dominant-baseline="central">DP OUT Adapter</text><text x="595.0" y="115.0" text-anchor="middle" dominant-baseline="central">（dock）</text></g><g id="node-mon"><rect x="740.0" y="70.0" width="96.0" height="72.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="788.0" y="97.0" text-anchor="middle" dominant-baseline="central">Monitor</text><text x="788.0" y="115.0" text-anchor="middle" dominant-baseline="central" class="mono">DPRX</text></g><g id="seg-1"><g id="ml-1"><line x1="174.0" y1="96.0" x2="250.0" y2="96.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="aux-1"><line x1="174.0" y1="118.0" x2="250.0" y2="118.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g></g><g id="seg-tunnel"><rect x="445" y="78" width="50" height="56" rx="6" fill="var(--bg-highlight)" stroke="var(--border-color)" stroke-width="1.5"/><g id="tunnel"><line x1="440.0" y1="106.0" x2="500.0" y2="106.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g></g><g id="seg-2"><g id="ml-2"><line x1="690.0" y1="96.0" x2="740.0" y2="96.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="aux-2"><line x1="690.0" y1="118.0" x2="740.0" y2="118.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g></g><text x="210.0" y="48.0" text-anchor="middle" dominant-baseline="central" class="secondary">第一段</text><text x="470.0" y="48.0" text-anchor="middle" dominant-baseline="central" class="secondary">USB4 tunnel</text><text x="710.0" y="48.0" text-anchor="middle" dominant-baseline="central" class="secondary">第二段</text><g id="legend"><rect x="24" y="190" width="812" height="120" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="40.0" y="214.0" text-anchor="start" dominant-baseline="central">實線是 Main Link／video，虛線是 AUX。</text><text x="40.0" y="240.0" text-anchor="start" dominant-baseline="central">Tunnel 把 AUX 與 video 封裝後送過 USB4 fabric。</text><text x="40.0" y="266.0" text-anchor="start" dominant-baseline="central" class="mono">延遲上限：DP IN 45 µs、DP OUT 10 µs。DPRX 須在 300 µs 內開始回應 AUX。</text></g>
</svg>
