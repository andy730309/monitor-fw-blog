<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>光譜儀與色度計怎麼得到 XYZ</title>
<desc>光譜儀用軟體乘標準觀察者；色度計用三片濾光片，再乘一個假設了典型面板光譜的 3×3 矩陣。此圖沒有對應文章。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="pipeline-spectrometer"><g id="pipeline-spectrometer-title"><rect x="36.0" y="24.0" width="300.0" height="44.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="186.0" y="46.0" text-anchor="middle" dominant-baseline="central">光譜儀</text></g><g id="pipeline-spectrometer-s0"><rect x="36.0" y="88.0" width="300.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="186.0" y="114.0" text-anchor="middle" dominant-baseline="central">光</text></g><g id="pipeline-spectrometer-s1"><rect x="36.0" y="166.0" width="300.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="186.0" y="192.0" text-anchor="middle" dominant-baseline="central">分光</text></g><line x1="186.0" y1="140.0" x2="186.0" y2="166.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><g id="pipeline-spectrometer-s2"><rect x="36.0" y="244.0" width="300.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="186.0" y="270.0" text-anchor="middle" dominant-baseline="central">各波長響應</text></g><line x1="186.0" y1="218.0" x2="186.0" y2="244.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><g id="pipeline-spectrometer-s3"><rect x="36.0" y="322.0" width="300.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="186.0" y="348.0" text-anchor="middle" dominant-baseline="central" class="mono">× Standard Observer</text></g><line x1="186.0" y1="296.0" x2="186.0" y2="322.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="186.0" y="309.0" text-anchor="middle" dominant-baseline="central" class="secondary">（軟體）</text><g id="pipeline-spectrometer-s4"><rect x="36.0" y="400.0" width="300.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--status-ok)" stroke-width="1.5"/><text x="186.0" y="426.0" text-anchor="middle" dominant-baseline="central" class="mono">XYZ</text></g><line x1="186.0" y1="374.0" x2="186.0" y2="400.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="pipeline-colorimeter"><g id="pipeline-colorimeter-title"><rect x="430.0" y="24.0" width="300.0" height="44.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="580.0" y="46.0" text-anchor="middle" dominant-baseline="central">色度計</text></g><g id="pipeline-colorimeter-s0"><rect x="430.0" y="88.0" width="300.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="580.0" y="114.0" text-anchor="middle" dominant-baseline="central">光</text></g><g id="pipeline-colorimeter-s1"><rect x="430.0" y="166.0" width="300.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="580.0" y="192.0" text-anchor="middle" dominant-baseline="central">濾片×3</text></g><line x1="580.0" y1="140.0" x2="580.0" y2="166.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><g id="pipeline-colorimeter-s2"><rect x="430.0" y="244.0" width="300.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="580.0" y="270.0" text-anchor="middle" dominant-baseline="central">sensor×3</text></g><line x1="580.0" y1="218.0" x2="580.0" y2="244.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><g id="pipeline-colorimeter-s3"><rect x="430.0" y="322.0" width="300.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="580.0" y="348.0" text-anchor="middle" dominant-baseline="central" class="mono">× 3×3 矩陣</text></g><line x1="580.0" y1="296.0" x2="580.0" y2="322.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="580.0" y="309.0" text-anchor="middle" dominant-baseline="central" class="secondary">（硬體）</text><g id="pipeline-colorimeter-s4"><rect x="430.0" y="400.0" width="300.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--status-ok)" stroke-width="1.5"/><text x="580.0" y="426.0" text-anchor="middle" dominant-baseline="central" class="mono">XYZ</text></g><line x1="580.0" y1="374.0" x2="580.0" y2="400.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="note-matrix"><g id="note-spectrum"><rect x="36.0" y="488.0" width="700.0" height="48.0" rx="6" fill="var(--bg-highlight)" stroke="var(--status-warn)" stroke-width="1.5"/><text x="386.0" y="512.0" text-anchor="middle" dominant-baseline="central">色度計的 3×3 矩陣假設了「某種典型面板光譜」</text></g><g id="note-to-matrix"><path d="M 736.0 512.0 L 790.0 512.0 L 790.0 348.0 L 730.0 348.0" fill="none" stroke="var(--status-warn)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g></g>
</svg>
