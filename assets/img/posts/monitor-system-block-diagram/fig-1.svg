<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 1．USB-C PD 與 Alt Mode 的訊號與控制路徑</title>
<desc>供電一路到 Type-C。PD 用 I²C 告訴 MCU，MCU 用 GPIO 切 MUX，DP lane 進 DP Rx。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="legend"><rect x="16.0" y="16.0" width="368.0" height="58.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><line x1="28.0" y1="32.0" x2="56.0" y2="32.0" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="64.0" y="32.0" text-anchor="start" dominant-baseline="central" class="secondary">資料／電源</text><line x1="28.0" y1="50.0" x2="56.0" y2="50.0" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="64.0" y="50.0" text-anchor="start" dominant-baseline="central" class="secondary">控制：CC、HPD、I²C、GPIO</text></g><g id="group-power"><rect x="16.0" y="84.0" width="368.0" height="250.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="28.0" y="100.0" text-anchor="start" dominant-baseline="central" class="secondary">電源</text><g id="node-acdc"><rect x="80.0" y="112.0" width="240.0" height="36.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="200.0" y="130.0" text-anchor="middle" dominant-baseline="central">AC／DC</text></g><g id="node-bb"><rect x="80.0" y="160.0" width="240.0" height="36.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="200.0" y="178.0" text-anchor="middle" dominant-baseline="central">Buck-Boost</text></g><g id="node-vbus"><rect x="80.0" y="208.0" width="240.0" height="36.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="200.0" y="226.0" text-anchor="middle" dominant-baseline="central" class="mono">VBUS</text></g><g id="node-port"><rect x="80.0" y="256.0" width="240.0" height="36.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="200.0" y="274.0" text-anchor="middle" dominant-baseline="central">Type-C Port</text></g><g id="pwr-1"><line x1="200.0" y1="148.0" x2="200.0" y2="160.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="pwr-2"><line x1="200.0" y1="196.0" x2="200.0" y2="208.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="pwr-3"><line x1="200.0" y1="244.0" x2="200.0" y2="256.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="28.0" y="308.0" text-anchor="start" dominant-baseline="central" class="secondary">契約例：20V／5A。上限看整機預算。</text></g><g id="group-pd"><rect x="16.0" y="354.0" width="368.0" height="250.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="28.0" y="370.0" text-anchor="start" dominant-baseline="central" class="secondary">USB PD／Type-C</text><g id="node-pd"><rect x="80.0" y="386.0" width="240.0" height="40.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="200.0" y="406.0" text-anchor="middle" dominant-baseline="central">PD Controller</text></g><g id="node-cc"><rect x="28.0" y="450.0" width="160.0" height="48.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="108.0" y="465.0" text-anchor="middle" dominant-baseline="central">CC／PD</text><text x="108.0" y="483.0" text-anchor="middle" dominant-baseline="central">PDO 協商</text></g><g id="node-mux"><rect x="208.0" y="450.0" width="160.0" height="48.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="288.0" y="474.0" text-anchor="middle" dominant-baseline="central">High-Speed MUX</text></g><g id="node-aux"><rect x="28.0" y="522.0" width="160.0" height="40.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="108.0" y="542.0" text-anchor="middle" dominant-baseline="central">AUX／HPD</text></g><g id="node-bill"><rect x="208.0" y="522.0" width="160.0" height="40.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="288.0" y="542.0" text-anchor="middle" dominant-baseline="central">Billboard</text></g><g id="pd-cc"><line x1="108.0" y1="426.0" x2="108.0" y2="450.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="pd-mux"><line x1="288.0" y1="426.0" x2="288.0" y2="450.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="cc-aux"><line x1="108.0" y1="498.0" x2="108.0" y2="522.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="mux-bill"><line x1="288.0" y1="498.0" x2="288.0" y2="522.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g></g><g id="port-pd"><line x1="200.0" y1="334.0" x2="200.0" y2="386.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><text x="214.0" y="360.0" text-anchor="start" dominant-baseline="central" class="mono">CC</text><g id="group-scaler"><rect x="16.0" y="624.0" width="368.0" height="210.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="28.0" y="640.0" text-anchor="start" dominant-baseline="central" class="secondary">Scaler</text><g id="node-mcu"><rect x="28.0" y="656.0" width="150.0" height="48.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="103.0" y="680.0" text-anchor="middle" dominant-baseline="central">Scaler MCU</text></g><g id="node-hub"><rect x="198.0" y="656.0" width="170.0" height="48.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="283.0" y="680.0" text-anchor="middle" dominant-baseline="central">USB Hub</text></g><g id="node-rx"><rect x="28.0" y="736.0" width="340.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="198.0" y="753.0" text-anchor="middle" dominant-baseline="central">DP Rx</text><text x="198.0" y="771.0" text-anchor="middle" dominant-baseline="central" class="mono">例：Pin C、4-lane</text></g><g id="notify"><line x1="178.0" y1="680.0" x2="198.0" y2="680.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g></g><g id="i2c"><line x1="103.0" y1="574.0" x2="103.0" y2="656.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><text x="112.0" y="630.0" text-anchor="start" dominant-baseline="central" class="mono">I²C／SMBus</text><text x="28.0" y="804.0" text-anchor="start" dominant-baseline="central" class="secondary">DP lane：MUX → DP Rx。GPIO：MCU 切 MUX。</text>
</svg>
