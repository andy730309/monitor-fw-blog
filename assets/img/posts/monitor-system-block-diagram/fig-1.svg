<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 1．USB-C PD 與 Alt Mode 的訊號與控制路徑</title>
<desc>AC／DC 經 Buck-Boost 供 VBUS 到 Type-C。PD Controller 處理 CC、MUX 與 AUX／HPD，並把結果送到 Scaler MCU。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="power-path"><g id="node-acdc"><rect x="24.0" y="28.0" width="140.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="94.0" y="56.0" text-anchor="middle" dominant-baseline="central">AC／DC</text></g><g id="node-bb"><rect x="210.0" y="28.0" width="160.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="290.0" y="56.0" text-anchor="middle" dominant-baseline="central">Buck-Boost</text></g><g id="node-vbus"><rect x="420.0" y="28.0" width="120.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="480.0" y="56.0" text-anchor="middle" dominant-baseline="central" class="mono">VBUS</text></g><g id="node-port"><rect x="590.0" y="28.0" width="200.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="690.0" y="56.0" text-anchor="middle" dominant-baseline="central">Type-C Port</text></g><g id="pwr-1"><line x1="164.0" y1="56.0" x2="210.0" y2="56.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="pwr-2"><line x1="370.0" y1="56.0" x2="420.0" y2="56.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="pwr-3"><line x1="540.0" y1="56.0" x2="590.0" y2="56.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g></g><g id="node-pd"><rect x="300.0" y="140.0" width="220.0" height="64.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="410.0" y="172.0" text-anchor="middle" dominant-baseline="central">PD Controller</text></g><g id="port-pd"><line x1="690.0" y1="84.0" x2="520.0" y2="160.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" marker-start="url(#arrow)"/></g><text x="640.0" y="108.0" text-anchor="middle" dominant-baseline="central" class="secondary">CC／PD</text><g id="node-cc"><rect x="24.0" y="250.0" width="240.0" height="70.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="144.0" y="276.0" text-anchor="middle" dominant-baseline="central">CC Line／PD</text><text x="144.0" y="294.0" text-anchor="middle" dominant-baseline="central">PDO 協商</text></g><g id="node-mux"><rect x="290.0" y="250.0" width="240.0" height="70.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="410.0" y="276.0" text-anchor="middle" dominant-baseline="central">High-Speed MUX</text><text x="410.0" y="294.0" text-anchor="middle" dominant-baseline="central">DP／USB 切換</text></g><g id="node-aux"><rect x="556.0" y="250.0" width="240.0" height="70.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="676.0" y="276.0" text-anchor="middle" dominant-baseline="central">AUX／HPD Detect</text><text x="676.0" y="294.0" text-anchor="middle" dominant-baseline="central">Alt Mode HPD</text></g><g id="pd-cc"><line x1="360.0" y1="204.0" x2="144.0" y2="250.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="pd-mux"><line x1="410.0" y1="204.0" x2="410.0" y2="250.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="pd-aux"><line x1="460.0" y1="204.0" x2="676.0" y2="250.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="node-mcu"><rect x="250.0" y="370.0" width="320.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="410.0" y="393.0" text-anchor="middle" dominant-baseline="central">Scaler MCU</text><text x="410.0" y="411.0" text-anchor="middle" dominant-baseline="central" class="mono">I²C／SMBus</text></g><g id="cc-mcu"><line x1="144.0" y1="320.0" x2="330.0" y2="370.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="mux-mcu"><line x1="410.0" y1="320.0" x2="410.0" y2="370.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="aux-mcu"><line x1="676.0" y1="320.0" x2="490.0" y2="370.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><text x="24.0" y="448.0" text-anchor="start" dominant-baseline="central" class="secondary">虛線是控制／通知，實線是供電路徑。</text>
</svg>
