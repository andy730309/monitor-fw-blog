<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 7．電源路徑簡圖</title>
<desc>AC／DC 先變成主機板電源軌，再從電源軌分給 Scaler、背光與 PD。VBUS 維持圖上的 5～20V。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="node-ac"><rect x="20.0" y="24.0" width="130.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="85.0" y="50.0" text-anchor="middle" dominant-baseline="central">AC In</text></g><g id="node-psu"><rect x="190.0" y="24.0" width="170.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="275.0" y="50.0" text-anchor="middle" dominant-baseline="central">AC／DC PSU</text></g><g id="node-rail"><rect x="400.0" y="20.0" width="396.0" height="60.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="598.0" y="41.0" text-anchor="middle" dominant-baseline="central" class="mono">＋12V／＋5V／＋3.3V</text><text x="598.0" y="59.0" text-anchor="middle" dominant-baseline="central">主機板電源軌</text></g><g id="ac-psu"><line x1="150.0" y1="50.0" x2="190.0" y2="50.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="psu-rail"><line x1="360.0" y1="50.0" x2="400.0" y2="50.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="rail-bus"><path d="M 598 80 L 598 112 L 134 112 L 674 112" fill="none" stroke="var(--accent-primary)" stroke-width="2"/></g><g id="node-core"><rect x="24.0" y="150.0" width="220.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="134.0" y="178.0" text-anchor="middle" dominant-baseline="central">Scaler Core</text></g><g id="node-tvdd"><rect x="24.0" y="250.0" width="220.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="134.0" y="278.0" text-anchor="middle" dominant-baseline="central">T-CON VDD</text></g><g id="node-pvdd"><rect x="24.0" y="350.0" width="220.0" height="68.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="134.0" y="375.0" text-anchor="middle" dominant-baseline="central">Panel VDDIO</text><text x="134.0" y="393.0" text-anchor="middle" dominant-baseline="central">AVDD／VGH／VGL</text></g><g id="drop-core"><line x1="134.0" y1="112.0" x2="134.0" y2="150.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="core-tvdd"><line x1="134.0" y1="206.0" x2="134.0" y2="250.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="tvdd-pvdd"><line x1="134.0" y1="306.0" x2="134.0" y2="350.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="node-bld"><rect x="294.0" y="150.0" width="220.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="404.0" y="178.0" text-anchor="middle" dominant-baseline="central">Backlight Drv</text></g><g id="node-led"><rect x="294.0" y="250.0" width="220.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="404.0" y="278.0" text-anchor="middle" dominant-baseline="central">LED Array</text></g><g id="node-ld"><rect x="294.0" y="350.0" width="220.0" height="68.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="404.0" y="375.0" text-anchor="middle" dominant-baseline="central">Local Dimming</text><text x="404.0" y="393.0" text-anchor="middle" dominant-baseline="central">（zones）</text></g><g id="drop-bld"><line x1="404.0" y1="112.0" x2="404.0" y2="150.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="bld-led"><line x1="404.0" y1="206.0" x2="404.0" y2="250.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="led-ld"><line x1="404.0" y1="306.0" x2="404.0" y2="350.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="node-pdc"><rect x="564.0" y="150.0" width="220.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="674.0" y="178.0" text-anchor="middle" dominant-baseline="central">PD Controller</text></g><g id="node-bb"><rect x="564.0" y="250.0" width="220.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="674.0" y="278.0" text-anchor="middle" dominant-baseline="central">Buck-Boost</text></g><g id="node-vb"><rect x="564.0" y="350.0" width="220.0" height="68.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="674.0" y="384.0" text-anchor="middle" dominant-baseline="central">VBUS 5～20V</text></g><g id="drop-pdc"><line x1="674.0" y1="112.0" x2="674.0" y2="150.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="pdc-bb"><line x1="674.0" y1="206.0" x2="674.0" y2="250.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="bb-vb"><line x1="674.0" y1="306.0" x2="674.0" y2="350.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="node-port"><rect x="564.0" y="450.0" width="220.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="674.0" y="469.0" text-anchor="middle" dominant-baseline="central">Type-C Port</text><text x="674.0" y="487.0" text-anchor="middle" dominant-baseline="central">筆電充電</text></g><g id="vb-port"><line x1="674.0" y1="418.0" x2="674.0" y2="450.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g>
</svg>
