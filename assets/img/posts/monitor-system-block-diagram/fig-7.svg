border-color)" stroke-width="1.5"/><text x="220.0" y="234.0" text-anchor="middle" dominant-baseline="central">Scaler Core</text></g><g id="node-tvdd"><rect x="68.0" y="260.0" width="304.0" height="28.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="220.0" y="274.0" text-anchor="middle" dominant-baseline="central">T-CON VDD</text></g><g id="node-pvdd"><rect x="68.0" y="300.0" width="304.0" height="32.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="220.0" y="316.0" text-anchor="middle" dominant-baseline="central" class="mono">VDDIO／AVDD／VGH／VGL</text></g><g id="rail-core"><line x1="40.0" y1="234.0" x2="68.0" y2="234.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="core-t"><line x1="220.0" y1="248.0" x2="220.0" y2="260.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="t-p"><line x1="220.0" y1="288.0" x2="220.0" y2="300.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g></g><g id="group-bl"><rect x="56.0" y="354.0" width="328.0" height="156.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="68.0" y="370.0" text-anchor="start" dominant-baseline="central" class="secondary">背光</text><g id="node-bld"><rect x="68.0" y="386.0" width="304.0" height="28.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="220.0" y="400.0" text-anchor="middle" dominant-baseline="central">Backlight Drv</text></g><g id="node-led"><rect x="68.0" y="426.0" width="304.0" height="28.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="220.0" y="440.0" text-anchor="middle" dominant-baseline="central">LED Array</text></g><g id="node-ld"><rect x="68.0" y="466.0" width="304.0" height="32.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="220.0" y="482.0" text-anchor="middle" dominant-baseline="central">Local Dimming（zones）</text></g><g id="rail-bl"><line x1="40.0" y1="400.0" x2="68.0" y2="400.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="bl-led"><line x1="220.0" y1="414.0" x2="220.0" y2="426.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="led-z"><line x1="220.0" y1="454.0" x2="220.0" y2="466.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g></g><g id="group-pd"><rect x="56.0" y="510.0" width="328.0" height="200.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="68.0" y="526.0" text-anchor="start" dominant-baseline="central" class="secondary">PD／Type-C</text><g id="node-pd"><rect x="68.0" y="542.0" width="304.0" height="28.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="220.0" y="556.0" text-anchor="middle" dominant-baseline="central">PD Controller</text></g><g id="node-bb"><rect x="68.0" y="582.0" width="304.0" height="28.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="220.0" y="596.0" text-anchor="middle" dominant-baseline="central">Buck-Boost</text></g><g id="node-vbus"><rect x="68.0" y="622.0" width="304.0" height="32.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="220.0" y="638.0" text-anchor="middle" dominant-baseline="central" class="mono">VBUS 5～20V</text></g><g id="node-port"><rect x="68.0" y="666.0" width="304.0" height="28.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="220.0" y="680.0" text-anchor="middle" dominant-baseline="central">Type-C → 筆電充電</text></g><g id="rail-pd"><line x1="40.0" y1="556.0" x2="68.0" y2="556.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="pd-bb"><line x1="220.0" y1="570.0" x2="220.0" y2="582.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="bb-v"><line x1="220.0" y1="610.0" x2="220.0" y2="622.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="v-port"><line x1="220.0" y1="654.0" x2="220.0" y2="666.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g></g>
