<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1280" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 2．系統級方塊圖：全貌</title>
<desc>六大子系統加上 NVRAM 與電源。實線是影像、USB 或供電；虛線是 I²C、PWM、HPD、GPIO。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="legend"><rect x="16.0" y="16.0" width="368.0" height="58.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><line x1="28.0" y1="32.0" x2="56.0" y2="32.0" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="64.0" y="32.0" text-anchor="start" dominant-baseline="central" class="secondary">資料／供電</text><line x1="28.0" y1="50.0" x2="56.0" y2="50.0" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="64.0" y="50.0" text-anchor="start" dominant-baseline="central" class="secondary">控制：I²C、HPD、PWM、GPIO</text></g><g id="group-video"><rect x="16.0" y="100.0" width="368.0" height="130.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="28.0" y="116.0" text-anchor="start" dominant-baseline="central" class="secondary">影像輸入</text><g id="node-host"><rect x="28.0" y="124.0" width="160.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="108.0" y="143.0" text-anchor="middle" dominant-baseline="central">Host</text><text x="108.0" y="161.0" text-anchor="middle" dominant-baseline="central">GPU／筆電</text></g><g id="node-rx"><rect x="212.0" y="124.0" width="156.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="290.0" y="152.0" text-anchor="middle" dominant-baseline="central">Receiver</text></g><g id="host-rx"><line x1="188.0" y1="152.0" x2="212.0" y2="152.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="28.0" y="204.0" text-anchor="start" dominant-baseline="central" class="mono">HDMI／DP／Type-C</text></g><g id="rx-scaler"><line x1="290.0" y1="230.0" x2="290.0" y2="254.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="group-scaler"><rect x="16.0" y="254.0" width="368.0" height="210.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="28.0" y="270.0" text-anchor="start" dominant-baseline="central" class="secondary">Scaler／SoC</text><g id="node-pipe"><rect x="28.0" y="278.0" width="220.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="138.0" y="301.0" text-anchor="middle" dominant-baseline="central">影像處理管線</text><text x="138.0" y="319.0" text-anchor="middle" dominant-baseline="central">Scaling 到 OSD</text></g><g id="node-mcu"><rect x="28.0" y="362.0" width="140.0" height="44.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="98.0" y="384.0" text-anchor="middle" dominant-baseline="central">MCU</text></g><g id="node-nv"><rect x="188.0" y="362.0" width="180.0" height="44.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="278.0" y="384.0" text-anchor="middle" dominant-baseline="central">NVRAM</text></g><g id="node-tx"><rect x="28.0" y="418.0" width="220.0" height="32.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="138.0" y="434.0" text-anchor="middle" dominant-baseline="central">Panel Tx</text></g><g id="pipe-mcu"><line x1="138.0" y1="342.0" x2="138.0" y2="362.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="mcu-nv"><line x1="168.0" y1="384.0" x2="188.0" y2="384.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="pipe-tx"><line x1="138.0" y1="406.0" x2="138.0" y2="418.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g></g><g id="tx-tcon"><line x1="138.0" y1="464.0" x2="138.0" y2="488.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="group-tcon"><rect x="16.0" y="488.0" width="368.0" height="150.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="28.0" y="504.0" text-anchor="start" dominant-baseline="central" class="secondary">T-CON＋Panel</text><g id="node-tcon"><rect x="28.0" y="512.0" width="220.0" height="44.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="138.0" y="534.0" text-anchor="middle" dominant-baseline="central">T-CON</text></g><g id="node-panel"><rect x="28.0" y="580.0" width="220.0" height="40.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="138.0" y="600.0" text-anchor="middle" dominant-baseline="central">Panel LCD／OLED</text></g><g id="tcon-panel"><line x1="138.0" y1="556.0" x2="138.0" y2="580.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="160.0" y="568.0" text-anchor="start" dominant-baseline="central" class="mono">eDP／V-by-One／LVDS</text></g><g id="group-bl"><rect x="16.0" y="658.0" width="368.0" height="110.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="28.0" y="674.0" text-anchor="start" dominant-baseline="central" class="secondary">背光（僅 LCD）</text><g id="node-bl"><rect x="28.0" y="682.0" width="240.0" height="48.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="148.0" y="706.0" text-anchor="middle" dominant-baseline="central">Backlight Driver</text></g><text x="28.0" y="746.0" text-anchor="start" dominant-baseline="central" class="mono">PWM／DC、SPI／I²C</text></g><g id="mcu-bl"><line x1="300.0" y1="706.0" x2="268.0" y2="706.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><text x="300.0" y="692.0" text-anchor="start" dominant-baseline="central" class="secondary">來自 MCU</text><g id="group-pd"><rect x="16.0" y="788.0" width="368.0" height="130.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="28.0" y="804.0" text-anchor="start" dominant-baseline="central" class="secondary">USB PD／Type-C</text><g id="node-usbc"><rect x="28.0" y="812.0" width="150.0" height="48.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="103.0" y="836.0" text-anchor="middle" dominant-baseline="central">Type-C</text></g><g id="node-pd"><rect x="200.0" y="812.0" width="168.0" height="48.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="284.0" y="836.0" text-anchor="middle" dominant-baseline="central">PD Controller</text></g><g id="typec-pd"><line x1="178.0" y1="836.0" x2="200.0" y2="836.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><text x="28.0" y="880.0" text-anchor="start" dominant-baseline="central" class="mono">I²C／SMBus → MCU</text><text x="28.0" y="900.0" text-anchor="start" dominant-baseline="central" class="mono">DP lane → Receiver</text></g><g id="group-hub"><rect x="16.0" y="938.0" width="368.0" height="100.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="28.0" y="954.0" text-anchor="start" dominant-baseline="central" class="secondary">USB Hub／KVM</text><g id="node-hub"><rect x="28.0" y="974.0" width="180.0" height="48.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="118.0" y="998.0" text-anchor="middle" dominant-baseline="central">Hub／KVM</text></g><g id="hub-usb"><line x1="250.0" y1="990.0" x2="208.0" y2="990.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="250.0" y="974.0" text-anchor="start" dominant-baseline="central" class="mono">USB</text><g id="hub-sw"><line x1="250.0" y1="1010.0" x2="208.0" y2="1010.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><text x="250.0" y="1010.0" text-anchor="start" dominant-baseline="central" class="secondary">切換</text></g><g id="group-power"><rect x="16.0" y="1058.0" width="368.0" height="100.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="28.0" y="1074.0" text-anchor="start" dominant-baseline="central" class="secondary">電源</text><g id="node-psu"><rect x="28.0" y="1086.0" width="150.0" height="48.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="103.0" y="1110.0" text-anchor="middle" dominant-baseline="central">AC／DC</text></g><g id="node-rail"><rect x="200.0" y="1086.0" width="168.0" height="48.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="284.0" y="1110.0" text-anchor="middle" dominant-baseline="central">主機板電源軌</text></g><g id="psu-rail"><line x1="178.0" y1="1110.0" x2="200.0" y2="1110.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g></g>
</svg>
