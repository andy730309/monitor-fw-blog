<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 2．系統級方塊圖：全貌</title>
<desc>影像從 Host 進 Scaler，經 T-CON 到 Panel。背光與 PD 走控制路徑，不跟像素線交錯。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="node-host"><rect x="20.0" y="36.0" width="140.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="90.0" y="59.0" text-anchor="middle" dominant-baseline="central">Host</text><text x="90.0" y="77.0" text-anchor="middle" dominant-baseline="central">GPU／筆電</text></g><g id="node-io"><rect x="210.0" y="36.0" width="130.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="275.0" y="68.0" text-anchor="middle" dominant-baseline="central">輸入介面</text></g><g id="node-scaler"><rect x="390.0" y="28.0" width="160.0" height="80.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="470.0" y="59.0" text-anchor="middle" dominant-baseline="central">Scaler</text><text x="470.0" y="77.0" text-anchor="middle" dominant-baseline="central">Mainboard</text></g><g id="node-tcon"><rect x="600.0" y="36.0" width="190.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="695.0" y="68.0" text-anchor="middle" dominant-baseline="central">T-CON Board</text></g><g id="node-panel"><rect x="600.0" y="180.0" width="190.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="695.0" y="203.0" text-anchor="middle" dominant-baseline="central">Panel</text><text x="695.0" y="221.0" text-anchor="middle" dominant-baseline="central">LCD／OLED</text></g><g id="node-bl"><rect x="400.0" y="180.0" width="160.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="480.0" y="212.0" text-anchor="middle" dominant-baseline="central">Backlight Driver</text></g><g id="node-pd"><rect x="20.0" y="320.0" width="210.0" height="76.0" rx="6" fill="var(--bg-highlight)" stroke="var(--border-color)" stroke-width="1.5"/><text x="125.0" y="349.0" text-anchor="middle" dominant-baseline="central">PD Controller</text><text x="125.0" y="367.0" text-anchor="middle" dominant-baseline="central">（獨立 IC）</text></g><g id="host-io"><line x1="160.0" y1="68.0" x2="210.0" y2="68.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="185.0" y="120.0" text-anchor="middle" dominant-baseline="central" class="secondary">HDMI／DP／Type-C</text><g id="io-scaler"><line x1="340.0" y1="68.0" x2="390.0" y2="68.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="scaler-tcon"><line x1="550.0" y1="68.0" x2="600.0" y2="68.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="tcon-panel"><line x1="695.0" y1="100.0" x2="695.0" y2="180.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="scaler-bl"><line x1="480.0" y1="108.0" x2="480.0" y2="180.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="bl-panel"><line x1="560.0" y1="212.0" x2="600.0" y2="212.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="io-pd"><path d="M 275.0 100.0 L 275.0 280.0 L 125.0 280.0 L 125.0 320.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><text x="200.0" y="266.0" text-anchor="middle" dominant-baseline="central" class="secondary">VBUS／CC／SBU</text><g id="pd-scaler"><path d="M 230.0 390.0 L 430.0 390.0 L 430.0 108.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><text x="250.0" y="372.0" text-anchor="start" dominant-baseline="central" class="secondary">I²C／SMBus</text><text x="250.0" y="408.0" text-anchor="start" dominant-baseline="central" class="secondary">DP Lanes／USB SS</text><text x="20.0" y="420.0" text-anchor="start" dominant-baseline="central" class="secondary">實線是影像資料。虛線是背光與 PD 控制。</text>
</svg>
