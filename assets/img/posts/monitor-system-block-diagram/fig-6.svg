<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 720" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 6．PD Controller（獨立 IC）路徑</title>
<desc>VBUS 是電源。CC、SBU、I²C、GPIO 是控制。DP lane 進 Scaler 的 DP Rx，USB SS 進 Hub。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="legend"><rect x="16.0" y="16.0" width="368.0" height="58.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><line x1="28.0" y1="32.0" x2="56.0" y2="32.0" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="64.0" y="32.0" text-anchor="start" dominant-baseline="central" class="secondary">資料／電源</text><line x1="28.0" y1="50.0" x2="56.0" y2="50.0" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="64.0" y="50.0" text-anchor="start" dominant-baseline="central" class="secondary">控制</text></g><g id="node-usbc"><rect x="16.0" y="80.0" width="368.0" height="44.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="200.0" y="102.0" text-anchor="middle" dominant-baseline="central">Type-C 插座</text></g><g id="group-pd"><rect x="16.0" y="148.0" width="368.0" height="280.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="28.0" y="164.0" text-anchor="start" dominant-baseline="central" class="secondary">PD Controller（獨立 IC）</text><g id="node-pe"><rect x="28.0" y="184.0" width="340.0" height="44.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="198.0" y="206.0" text-anchor="middle" dominant-baseline="central">Policy Engine／DPM</text></g><g id="node-mux"><rect x="28.0" y="252.0" width="160.0" height="44.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="108.0" y="274.0" text-anchor="middle" dominant-baseline="central">High-Speed MUX</text></g><g id="node-aux"><rect x="208.0" y="252.0" width="160.0" height="44.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="288.0" y="265.0" text-anchor="middle" dominant-baseline="central">AUX／HPD</text><text x="288.0" y="283.0" text-anchor="middle" dominant-baseline="central" class="mono">SBU</text></g><g id="node-bb"><rect x="208.0" y="320.0" width="160.0" height="40.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="288.0" y="340.0" text-anchor="middle" dominant-baseline="central">Billboard</text></g><g id="pe-mux"><line x1="108.0" y1="228.0" x2="108.0" y2="252.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="pe-aux"><line x1="288.0" y1="228.0" x2="288.0" y2="252.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="aux-bill"><line x1="288.0" y1="296.0" x2="288.0" y2="320.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><text x="124.0" y="240.0" text-anchor="start" dominant-baseline="central" class="mono">DP／USB</text></g><g id="vbus"><line x1="300.0" y1="124.0" x2="300.0" y2="184.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="308.0" y="154.0" text-anchor="start" dominant-baseline="central" class="mono">VBUS</text><g id="cc"><line x1="340.0" y1="124.0" x2="340.0" y2="184.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><text x="348.0" y="154.0" text-anchor="start" dominant-baseline="central" class="mono">CC</text><g id="group-soc"><rect x="16.0" y="448.0" width="368.0" height="246.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="28.0" y="464.0" text-anchor="start" dominant-baseline="central" class="secondary">Scaler／Hub</text><g id="node-mcu"><rect x="28.0" y="484.0" width="160.0" height="48.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="108.0" y="508.0" text-anchor="middle" dominant-baseline="central">MCU</text></g><g id="node-rx"><rect x="208.0" y="484.0" width="160.0" height="48.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="288.0" y="508.0" text-anchor="middle" dominant-baseline="central">DP Rx</text></g><g id="node-hub"><rect x="28.0" y="568.0" width="340.0" height="40.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="198.0" y="588.0" text-anchor="middle" dominant-baseline="central">USB Hub／KVM</text></g><text x="28.0" y="620.0" text-anchor="start" dominant-baseline="central" class="mono">I²C／SMBus：PD → MCU</text><text x="28.0" y="642.0" text-anchor="start" dominant-baseline="central" class="mono">DP lane：MUX → DP Rx</text><text x="28.0" y="664.0" text-anchor="start" dominant-baseline="central" class="mono">USB SS：MUX → Hub。GPIO：MCU → MUX</text></g><g id="i2c"><path d="M 28.0 206.0 L 20.0 206.0 L 20.0 508.0 L 28.0 508.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g>
</svg>
