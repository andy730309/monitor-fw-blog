<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 6．PD Controller（獨立 IC）路徑</title>
<desc>Type-C 的 VBUS／CC／SBU 進獨立 PD。Policy Engine 控制 MUX、AUX／HPD 與 Billboard，再以 I²C 通知 MCU。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="node-usbc"><rect x="24.0" y="36.0" width="200.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="124.0" y="68.0" text-anchor="middle" dominant-baseline="central">Type-C 插座</text></g><g id="pd-ic"><rect x="250" y="24" width="546" height="230" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="523.0" y="42.0" text-anchor="middle" dominant-baseline="central" class="secondary">PD Controller（獨立 IC）</text><g id="node-pe"><rect x="270.0" y="64.0" width="230.0" height="60.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="385.0" y="94.0" text-anchor="middle" dominant-baseline="central">Policy Engine／DPM</text></g><g id="node-mux"><rect x="530.0" y="64.0" width="246.0" height="60.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="653.0" y="85.0" text-anchor="middle" dominant-baseline="central">High-Speed MUX</text><text x="653.0" y="103.0" text-anchor="middle" dominant-baseline="central">Re-driver</text></g><g id="node-aux"><rect x="270.0" y="160.0" width="230.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="385.0" y="192.0" text-anchor="middle" dominant-baseline="central">AUX／HPD Detect</text></g><g id="node-bb"><rect x="530.0" y="160.0" width="246.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="653.0" y="192.0" text-anchor="middle" dominant-baseline="central">Billboard Device</text></g><g id="pe-mux"><line x1="500.0" y1="94.0" x2="530.0" y2="94.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="pe-aux"><line x1="385.0" y1="124.0" x2="385.0" y2="160.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="pe-bb"><line x1="430.0" y1="110.0" x2="620.0" y2="160.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g></g><g id="usbc-pd"><line x1="224.0" y1="68.0" x2="270.0" y2="90.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="247.0" y="56.0" text-anchor="middle" dominant-baseline="central" class="secondary">VBUS／CC／SBU</text></g><g id="node-mcu"><rect x="24.0" y="300.0" width="210.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="129.0" y="332.0" text-anchor="middle" dominant-baseline="central">MCU／RTOS</text></g><g id="pd-mcu"><line x1="250.0" y1="200.0" x2="150.0" y2="300.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="160.0" y="260.0" text-anchor="middle" dominant-baseline="central" class="secondary">I²C／SMBus</text></g><g id="node-tx"><rect x="250.0" y="400.0" width="220.0" height="60.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="360.0" y="430.0" text-anchor="middle" dominant-baseline="central">Panel Tx</text></g><g id="node-hub"><rect x="540.0" y="400.0" width="250.0" height="60.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="665.0" y="430.0" text-anchor="middle" dominant-baseline="central">USB Hub／KVM</text></g><g id="mux-tx"><path d="M 776.0 94.0 L 800.0 94.0 L 800.0 360.0 L 360.0 360.0 L 360.0 400.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><text x="620.0" y="346.0" text-anchor="middle" dominant-baseline="central" class="secondary">DP Lanes</text><g id="mux-hub"><path d="M 800.0 300.0 L 665.0 300.0 L 665.0 400.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><text x="760.0" y="286.0" text-anchor="middle" dominant-baseline="central" class="secondary">USB SS</text>
</svg>
