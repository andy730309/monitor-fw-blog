<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 4．T-CON Board 到 Panel</title>
<desc>高速接收進時序產生器，再分別驅動 Source 與 Gate。PSR 在時序器正下方，不穿過驅動器。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="node-tx"><rect x="20.0" y="28.0" width="170.0" height="60.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="105.0" y="58.0" text-anchor="middle" dominant-baseline="central">Scaler Panel Tx</text></g><g id="node-rx"><rect x="230.0" y="28.0" width="160.0" height="60.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="310.0" y="58.0" text-anchor="middle" dominant-baseline="central">高速接收</text></g><g id="node-tg"><rect x="430.0" y="20.0" width="366.0" height="76.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="613.0" y="49.0" text-anchor="middle" dominant-baseline="central">時序產生器</text><text x="613.0" y="67.0" text-anchor="middle" dominant-baseline="central" class="mono">Vsync／Hsync／DE／CLK</text></g><g id="tx-rx"><line x1="190.0" y1="58.0" x2="230.0" y2="58.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="rx-tg"><line x1="390.0" y1="58.0" x2="430.0" y2="58.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="node-src"><rect x="230.0" y="160.0" width="180.0" height="60.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="320.0" y="181.0" text-anchor="middle" dominant-baseline="central">Source Driver</text><text x="320.0" y="199.0" text-anchor="middle" dominant-baseline="central">（源極）</text></g><g id="node-gate"><rect x="20.0" y="160.0" width="180.0" height="60.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="110.0" y="181.0" text-anchor="middle" dominant-baseline="central">Gate Driver</text><text x="110.0" y="199.0" text-anchor="middle" dominant-baseline="central">（閘極）</text></g><g id="node-psr"><rect x="470.0" y="160.0" width="326.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="633.0" y="188.0" text-anchor="middle" dominant-baseline="central">PSR Frame Buffer（選配）</text></g><g id="tg-bus"><path d="M 520.0 96.0 L 520.0 128.0 L 110.0 128.0" fill="none" stroke="var(--accent-primary)" stroke-width="2"/></g><g id="tg-gate"><path d="M 110.0 128.0 L 110.0 160.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="tg-src"><path d="M 320.0 128.0 L 320.0 160.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="tg-psr"><line x1="633.0" y1="96.0" x2="633.0" y2="160.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="node-tft"><rect x="20.0" y="300.0" width="390.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="215.0" y="332.0" text-anchor="middle" dominant-baseline="central">TFT 矩陣＋彩色濾光片</text></g><g id="node-led"><rect x="470.0" y="300.0" width="326.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="633.0" y="332.0" text-anchor="middle" dominant-baseline="central">LED 背光（僅 LCD）</text></g><g id="src-tft"><line x1="320.0" y1="220.0" x2="280.0" y2="300.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="gate-tft"><line x1="110.0" y1="220.0" x2="110.0" y2="300.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="led-tft"><line x1="470.0" y1="332.0" x2="410.0" y2="332.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g>
</svg>
