<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 4．T-CON Board 到 Panel</title>
<desc>差分影像進 T-CON，時序產生器再驅動 Source 與 Gate。PSR 與 LED 用虛線。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="legend"><rect x="16.0" y="16.0" width="368.0" height="58.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><line x1="28.0" y1="32.0" x2="56.0" y2="32.0" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="64.0" y="32.0" text-anchor="start" dominant-baseline="central" class="secondary">影像</text><line x1="28.0" y1="50.0" x2="56.0" y2="50.0" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="64.0" y="50.0" text-anchor="start" dominant-baseline="central" class="secondary">旁路</text></g><g id="node-tx"><rect x="16.0" y="78.0" width="368.0" height="40.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="200.0" y="98.0" text-anchor="middle" dominant-baseline="central">Scaler Panel Tx</text></g><g id="group-tcon"><rect x="16.0" y="140.0" width="368.0" height="340.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="28.0" y="156.0" text-anchor="start" dominant-baseline="central" class="secondary">T-CON</text><g id="node-rx"><rect x="28.0" y="172.0" width="340.0" height="40.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="198.0" y="192.0" text-anchor="middle" dominant-baseline="central">高速接收</text></g><g id="node-tg"><rect x="28.0" y="240.0" width="200.0" height="64.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="128.0" y="263.0" text-anchor="middle" dominant-baseline="central">時序產生器</text><text x="128.0" y="281.0" text-anchor="middle" dominant-baseline="central" class="mono">Vsync／Hsync／DE／CLK</text></g><g id="node-psr"><rect x="244.0" y="248.0" width="124.0" height="48.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="306.0" y="263.0" text-anchor="middle" dominant-baseline="central">PSR</text><text x="306.0" y="281.0" text-anchor="middle" dominant-baseline="central">選配</text></g><g id="node-src"><rect x="28.0" y="332.0" width="160.0" height="48.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="108.0" y="347.0" text-anchor="middle" dominant-baseline="central">Source Driver</text><text x="108.0" y="365.0" text-anchor="middle" dominant-baseline="central">源極</text></g><g id="node-gate"><rect x="208.0" y="332.0" width="160.0" height="48.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="288.0" y="347.0" text-anchor="middle" dominant-baseline="central">Gate Driver</text><text x="288.0" y="365.0" text-anchor="middle" dominant-baseline="central">閘極</text></g><g id="tx-rx"><line x1="200.0" y1="118.0" x2="200.0" y2="172.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="214.0" y="146.0" text-anchor="start" dominant-baseline="central" class="mono">eDP／V-by-One／LVDS</text><g id="rx-tg"><line x1="128.0" y1="212.0" x2="128.0" y2="240.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="tg-psr"><line x1="228.0" y1="272.0" x2="244.0" y2="272.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="tg-src"><line x1="108.0" y1="304.0" x2="108.0" y2="332.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="tg-gate"><path d="M 208.0 304.0 L 288.0 304.0 L 288.0 332.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g></g><g id="group-panel"><rect x="16.0" y="500.0" width="368.0" height="176.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="28.0" y="516.0" text-anchor="start" dominant-baseline="central" class="secondary">Panel</text><g id="node-tft"><rect x="28.0" y="532.0" width="340.0" height="48.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="198.0" y="556.0" text-anchor="middle" dominant-baseline="central">TFT＋彩色濾光片</text></g><g id="node-led"><rect x="28.0" y="608.0" width="200.0" height="44.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="128.0" y="630.0" text-anchor="middle" dominant-baseline="central">LED 背光（僅 LCD）</text></g><g id="src-tft"><line x1="108.0" y1="380.0" x2="108.0" y2="532.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="gate-tft"><line x1="288.0" y1="380.0" x2="288.0" y2="532.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="led-tft"><line x1="128.0" y1="608.0" x2="128.0" y2="580.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g></g>
</svg>
