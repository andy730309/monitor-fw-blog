<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 5．背光控制路徑</title>
<desc>PWM／DC 與 SPI／I²C 是控制。LED 電流是實線。保護由驅動器內部 MCU 執行。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="legend"><rect x="16.0" y="16.0" width="368.0" height="58.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><line x1="28.0" y1="32.0" x2="56.0" y2="32.0" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="64.0" y="32.0" text-anchor="start" dominant-baseline="central" class="secondary">LED 電流</text><line x1="28.0" y1="50.0" x2="56.0" y2="50.0" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="64.0" y="50.0" text-anchor="start" dominant-baseline="central" class="secondary">控制：PWM、SPI、I²C</text></g><g id="group-scaler"><rect x="16.0" y="84.0" width="368.0" height="80.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="28.0" y="100.0" text-anchor="start" dominant-baseline="central" class="secondary">Scaler</text><g id="node-ctrl"><rect x="28.0" y="106.0" width="340.0" height="40.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="198.0" y="126.0" text-anchor="middle" dominant-baseline="central" class="mono">PWM／DC、SPI／I²C</text></g></g><g id="group-bl"><rect x="16.0" y="184.0" width="368.0" height="230.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="28.0" y="200.0" text-anchor="start" dominant-baseline="central" class="secondary">Backlight Driver</text><g id="node-drv"><rect x="28.0" y="208.0" width="200.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="128.0" y="225.0" text-anchor="middle" dominant-baseline="central">Buck／Boost</text><text x="128.0" y="243.0" text-anchor="middle" dominant-baseline="central">LED Driver</text></g><g id="node-mcu"><rect x="244.0" y="208.0" width="124.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="306.0" y="234.0" text-anchor="middle" dominant-baseline="central">內部 MCU</text></g><g id="node-prot"><rect x="28.0" y="280.0" width="340.0" height="40.0" rx="6" fill="var(--bg-node)" stroke="var(--status-warn)" stroke-width="1.5"/><text x="198.0" y="300.0" text-anchor="middle" dominant-baseline="central">OVP／OCP／OTP</text></g><g id="node-zone"><rect x="28.0" y="340.0" width="340.0" height="48.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="198.0" y="355.0" text-anchor="middle" dominant-baseline="central">區域調光</text><text x="198.0" y="373.0" text-anchor="middle" dominant-baseline="central">幾百～上千區</text></g><g id="ctrl-drv"><line x1="128.0" y1="164.0" x2="128.0" y2="208.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="drv-mcu"><line x1="228.0" y1="234.0" x2="244.0" y2="234.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="mcu-prot"><line x1="200.0" y1="260.0" x2="200.0" y2="280.0" fill="none" stroke="var(--status-warn)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="drv-zone"><line x1="200.0" y1="320.0" x2="200.0" y2="340.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g></g><g id="group-panel"><rect x="16.0" y="434.0" width="368.0" height="100.0" rx="6" fill="none" stroke="var(--border-color)" stroke-width="1.5"/><text x="28.0" y="450.0" text-anchor="start" dominant-baseline="central" class="secondary">Panel（僅 LCD）</text><g id="node-led"><rect x="28.0" y="458.0" width="150.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="103.0" y="484.0" text-anchor="middle" dominant-baseline="central">LED 背光</text></g><g id="node-tft"><rect x="200.0" y="458.0" width="168.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="284.0" y="484.0" text-anchor="middle" dominant-baseline="central">TFT＋濾光片</text></g><g id="zone-led"><line x1="103.0" y1="388.0" x2="103.0" y2="458.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="led-tft"><line x1="178.0" y1="484.0" x2="200.0" y2="484.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g></g>
</svg>
