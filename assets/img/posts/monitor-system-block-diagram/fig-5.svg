<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 5．背光控制路徑</title>
<desc>Scaler 把 PWM／DC 與區域調光資料送給 LED driver，分區電流再點亮背光。保護電路是控制旁路。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="node-ctrl"><rect x="24.0" y="28.0" width="280.0" height="72.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="164.0" y="55.0" text-anchor="middle" dominant-baseline="central">Scaler 背光控制</text><text x="164.0" y="73.0" text-anchor="middle" dominant-baseline="central" class="mono">PWM／DC＋區域調光資料</text></g><g id="node-drv"><rect x="360.0" y="28.0" width="230.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="475.0" y="51.0" text-anchor="middle" dominant-baseline="central">Buck／Boost</text><text x="475.0" y="69.0" text-anchor="middle" dominant-baseline="central">LED Driver</text></g><g id="node-zone"><rect x="630.0" y="24.0" width="166.0" height="76.0" rx="6" fill="var(--bg-highlight)" stroke="var(--border-color)" stroke-width="1.5"/><text x="713.0" y="53.0" text-anchor="middle" dominant-baseline="central">Local Dimming</text><text x="713.0" y="71.0" text-anchor="middle" dominant-baseline="central">數百～上千區</text></g><g id="ctrl-drv"><line x1="304.0" y1="60.0" x2="360.0" y2="60.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="drv-zone"><line x1="590.0" y1="60.0" x2="630.0" y2="60.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="node-prot"><rect x="360.0" y="150.0" width="230.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--status-warn)" stroke-width="1.5"/><text x="475.0" y="173.0" text-anchor="middle" dominant-baseline="central">OVP／OCP／OTP</text><text x="475.0" y="191.0" text-anchor="middle" dominant-baseline="central">Thermal Protection</text></g><g id="prot-drv"><line x1="475.0" y1="150.0" x2="475.0" y2="92.0" fill="none" stroke="var(--status-warn)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="node-led"><rect x="360.0" y="270.0" width="230.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="475.0" y="298.0" text-anchor="middle" dominant-baseline="central">LED 背光（僅 LCD）</text></g><g id="node-tft"><rect x="630.0" y="262.0" width="166.0" height="72.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="713.0" y="289.0" text-anchor="middle" dominant-baseline="central">TFT 矩陣</text><text x="713.0" y="307.0" text-anchor="middle" dominant-baseline="central">＋彩色濾光片</text></g><g id="zone-led"><line x1="713.0" y1="100.0" x2="500.0" y2="270.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="led-tft"><line x1="590.0" y1="298.0" x2="630.0" y2="298.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g>
</svg>
