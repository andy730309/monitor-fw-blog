<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1020" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 3．Scaler／Mainboard 內部</title>
<desc>左欄是像素管線，右欄是 MCU 的控制。輸入介面只標本文寫過的 HDMI、DP＋AUX 與 Type-C。</desc>
<style>
  svg {
