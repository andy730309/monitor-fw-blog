<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 3．Scaler／Mainboard 內部</title>
<desc>HDMI、DP、Type-C 匯入影像處理管線，再送到 Panel Tx。MCU 以控制路徑接 Hub、PD 與 OSD。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="inputs"><g id="node-hdmi"><rect x="24.0" y="28.0" width="190.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="119.0" y="54.0" text-anchor="middle" dominant-baseline="central" class="mono">HDMI Rx</text></g><g id="node-dp"><rect x="24.0" y="100.0" width="190.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="119.0" y="126.0" text-anchor="middle" dominant-baseline="central" class="mono">DP Rx＋AUX</text></g><g id="node-usbc"><rect x="24.0" y="172.0" width="190.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="119.0" y="198.0" text-anchor="middle" dominant-baseline="central">Type-C 插座</text></g></g><g id="node-sel"><rect x="260.0" y="92.0" width="200.0" height="68.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="360.0" y="126.0" text-anchor="middle" dominant-baseline="central">影像輸入選擇</text></g><g id="in-hdmi"><line x1="214.0" y1="54.0" x2="300.0" y2="110.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="in-dp"><line x1="214.0" y1="126.0" x2="260.0" y2="126.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="in-usbc"><line x1="214.0" y1="198.0" x2="300.0" y2="146.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="node-pipe"><rect x="500.0" y="28.0" width="296.0" height="100.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="648.0" y="60.0" text-anchor="middle" dominant-baseline="central">影像處理管線</text><text x="648.0" y="78.0" text-anchor="middle" dominant-baseline="central">Scaling、Gamma、HDR</text><text x="648.0" y="96.0" text-anchor="middle" dominant-baseline="central">OD、OSD</text></g><g id="sel-pipe"><line x1="460.0" y1="126.0" x2="500.0" y2="78.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="node-tx"><rect x="500.0" y="156.0" width="296.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="648.0" y="175.0" text-anchor="middle" dominant-baseline="central">Panel Tx</text><text x="648.0" y="193.0" text-anchor="middle" dominant-baseline="central" class="mono">eDP／V-by-One／LVDS</text></g><g id="pipe-tx"><line x1="648.0" y1="128.0" x2="648.0" y2="156.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="node-bl"><rect x="500.0" y="236.0" width="296.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="648.0" y="259.0" text-anchor="middle" dominant-baseline="central">背光控制</text><text x="648.0" y="277.0" text-anchor="middle" dominant-baseline="central" class="mono">PWM／DC＋區域調光資料</text></g><g id="pipe-bl"><line x1="648.0" y1="212.0" x2="648.0" y2="236.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="node-mcu"><rect x="260.0" y="340.0" width="220.0" height="68.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="370.0" y="365.0" text-anchor="middle" dominant-baseline="central">MCU／RTOS</text><text x="370.0" y="383.0" text-anchor="middle" dominant-baseline="central" class="mono">8051／ARM／RISC-V</text></g><g id="pipe-mcu"><line x1="560.0" y1="128.0" x2="370.0" y2="340.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="node-hub"><rect x="24.0" y="460.0" width="240.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="144.0" y="483.0" text-anchor="middle" dominant-baseline="central">USB Hub</text><text x="144.0" y="501.0" text-anchor="middle" dominant-baseline="central">Billboard／KVM</text></g><g id="node-pdif"><rect x="290.0" y="460.0" width="240.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="410.0" y="483.0" text-anchor="middle" dominant-baseline="central">PD Controller 介面</text><text x="410.0" y="501.0" text-anchor="middle" dominant-baseline="central" class="mono">I²C／SMBus</text></g><g id="node-osd"><rect x="556.0" y="460.0" width="240.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="676.0" y="492.0" text-anchor="middle" dominant-baseline="central">OSD 引擎</text></g><g id="mcu-hub"><line x1="300.0" y1="408.0" x2="144.0" y2="460.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="mcu-pd"><line x1="370.0" y1="408.0" x2="410.0" y2="460.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><g id="mcu-osd"><line x1="430.0" y1="390.0" x2="640.0" y2="460.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/></g><text x="24.0" y="544.0" text-anchor="start" dominant-baseline="central" class="secondary">實線是像素路徑。虛線是 MCU 與背光控制。</text>
</svg>
