<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 1．HDMI 讀取 EDID 的順序</title>
<desc>來源端送出＋5V 後，接收端應讓 EDID 可讀再拉高 HPD，來源端才經 DDC 讀取。橫軸只表示先後，只有 20 ms 是規格時間。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="signal-names"><text x="36.0" y="78.0" text-anchor="start" dominant-baseline="central" class="mono">＋5V</text><text x="36.0" y="168.0" text-anchor="start" dominant-baseline="central">EDID 可讀</text><text x="36.0" y="258.0" text-anchor="start" dominant-baseline="central" class="mono">HPD</text><text x="36.0" y="348.0" text-anchor="start" dominant-baseline="central" class="mono">DDC</text></g><g id="waveform-5v"><path d="M 150.0 100.0 L 230.0 100.0 L 230.0 56.0 L 790.0 56.0" fill="none" stroke="var(--accent-primary)" stroke-width="2"/></g><g id="waveform-edid"><path d="M 150.0 190.0 L 390.0 190.0 L 390.0 146.0 L 790.0 146.0" fill="none" stroke="var(--accent-primary)" stroke-width="2"/></g><g id="waveform-hpd"><path d="M 150.0 280.0 L 500.0 280.0 L 500.0 236.0 L 790.0 236.0" fill="none" stroke="var(--accent-primary)" stroke-width="2"/></g><g id="waveform-ddc"><path d="M 150.0 370.0 L 600.0 370.0 L 600.0 326.0 L 710.0 326.0 L 710.0 370.0 L 790.0 370.0" fill="none" stroke="var(--accent-primary)" stroke-width="2"/></g><g id="delay-20ms"><line x1="230" y1="118" x2="390" y2="118" stroke="var(--border-color)" stroke-width="1.5"/><line x1="230" y1="112" x2="230" y2="124" stroke="var(--border-color)" stroke-width="1.5"/><line x1="390" y1="112" x2="390" y2="124" stroke="var(--border-color)" stroke-width="1.5"/><text x="310.0" y="104.0" text-anchor="middle" dominant-baseline="central" class="mono">≤20 ms</text></g><text x="300.0" y="40.0" text-anchor="middle" dominant-baseline="central" class="secondary">來源端送出</text><text x="470.0" y="128.0" text-anchor="middle" dominant-baseline="central" class="secondary">確認可讀後才拉高</text><text x="655.0" y="300.0" text-anchor="middle" dominant-baseline="central" class="mono">讀 EDID（0xA0）</text><g id="axis"><line x1="150" y1="400" x2="790" y2="400" stroke="var(--border-color)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="470.0" y="418.0" text-anchor="middle" dominant-baseline="central" class="secondary">時間（只表示先後）</text></g><g id="notes"><text x="420.0" y="448.0" text-anchor="middle" dominant-baseline="central" class="secondary">關機或待命：EDID 還不可讀，就不得拉高 HPD。</text><text x="420.0" y="472.0" text-anchor="middle" dominant-baseline="central" class="secondary">內容變更時的 HPD 低脈衝至少 100 ms，是另一個事件。</text></g>
</svg>
