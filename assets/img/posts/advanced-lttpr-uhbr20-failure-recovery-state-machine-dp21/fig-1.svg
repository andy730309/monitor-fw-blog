<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 820" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 1．DPTX 的 LTTPR／UHBR20 失敗回復狀態機</title>
<desc>HPD 後判讀 one-hot 顆數。有 LTTPR 才做 0x55 再 0xAA。訓練失敗先重試同 config，再用盡才沿 UHBR20、13.5、10、HBR3 降頻率。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="state-idle"><rect x="346.0" y="28.0" width="168.0" height="52.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="430.0" y="54.0" text-anchor="middle" dominant-baseline="central">IDLE</text></g><g id="state-detect"><rect x="316.0" y="128.0" width="228.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="430.0" y="156.0" text-anchor="middle" dominant-baseline="central">LTTPR_DETECT</text></g><g id="state-mode"><rect x="28.0" y="250.0" width="250.0" height="68.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="153.0" y="275.0" text-anchor="middle" dominant-baseline="central">MODE_SEQ</text><text x="153.0" y="293.0" text-anchor="middle" dominant-baseline="central" class="mono">先寫 0x55，再寫 0xAA</text></g><g id="state-zero"><rect x="582.0" y="250.0" width="250.0" height="68.0" rx="6" fill="var(--bg-node)" stroke="var(--status-warn)" stroke-width="1.5"/><text x="707.0" y="284.0" text-anchor="middle" dominant-baseline="central">當 0 顆重試</text></g><g id="state-training"><rect x="280.0" y="390.0" width="300.0" height="68.0" rx="6" fill="var(--bg-highlight)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="430.0" y="415.0" text-anchor="middle" dominant-baseline="central">TRAINING</text><text x="430.0" y="433.0" text-anchor="middle" dominant-baseline="central" class="mono">CR → EQ／CDS</text></g><g id="state-success"><rect x="28.0" y="530.0" width="230.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--status-ok)" stroke-width="1.5"/><text x="143.0" y="553.0" text-anchor="middle" dominant-baseline="central">SUCCESS</text><text x="143.0" y="571.0" text-anchor="middle" dominant-baseline="central">背景監控</text></g><g id="state-retry"><rect x="300.0" y="660.0" width="240.0" height="64.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="420.0" y="692.0" text-anchor="middle" dominant-baseline="central">同 config 重試</text></g><g id="state-fallback"><rect x="548.0" y="520.0" width="240.0" height="74.0" rx="6" fill="var(--bg-node)" stroke="var(--status-warn)" stroke-width="1.5"/><text x="668.0" y="548.0" text-anchor="middle" dominant-baseline="central">FALLBACK</text><text x="668.0" y="566.0" text-anchor="middle" dominant-baseline="central">先降頻率，不先減 lane</text></g><g id="state-stop"><rect x="548.0" y="690.0" width="240.0" height="60.0" rx="6" fill="var(--bg-highlight)" stroke="var(--status-warn)" stroke-width="1.5"/><text x="668.0" y="720.0" text-anchor="middle" dominant-baseline="central">停止並回報錯誤</text></g><g id="edge-hpd"><line x1="430.0" y1="80.0" x2="430.0" y2="128.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="458.0" y="104.0" text-anchor="middle" dominant-baseline="central" class="secondary">HPD</text></g><g id="edge-count"><path d="M 316.0 156.0 L 153.0 156.0 L 153.0 250.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="168.0" y="176.0" text-anchor="start" dominant-baseline="central" class="secondary">count＞0</text><g id="edge-direct"><line x1="430.0" y1="184.0" x2="430.0" y2="390.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="446.0" y="250.0" text-anchor="start" dominant-baseline="central" class="secondary">count＝0（直通 DPRX）</text><g id="edge-bad"><path d="M 544.0 156.0 L 707.0 156.0 L 707.0 250.0" fill="none" stroke="var(--status-warn)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="560.0" y="176.0" text-anchor="start" dominant-baseline="central" class="warn">AUX 失敗／非法型樣</text><g id="edge-mode-train"><path d="M 153.0 318.0 L 153.0 424.0 L 280.0 424.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="edge-zero-train"><path d="M 707.0 318.0 L 707.0 424.0 L 580.0 424.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="edge-ok"><path d="M 360.0 458.0 L 143.0 458.0 L 143.0 530.0" fill="none" stroke="var(--status-ok)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="168.0" y="488.0" text-anchor="start" dominant-baseline="central" class="ok">成功</text><g id="edge-retry"><line x1="430.0" y1="458.0" x2="420.0" y2="660.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="520.0" y="560.0" text-anchor="middle" dominant-baseline="central" class="secondary">失敗且未達門檻</text></g><g id="edge-retry-back"><path d="M 300.0 692.0 L 270.0 692.0 L 270.0 500.0 L 300.0 500.0 L 300.0 458.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="282.0" y="488.0" text-anchor="start" dominant-baseline="central" class="secondary">再訓練</text><g id="edge-fb"><line x1="580.0" y1="430.0" x2="640.0" y2="520.0" fill="none" stroke="var(--status-warn)" stroke-width="2" marker-end="url(#arrow)"/><text x="700.0" y="470.0" text-anchor="middle" dominant-baseline="central" class="secondary">重試用盡</text></g><g id="edge-downrate"><path d="M 830.0 546.0 L 830.0 424.0 L 580.0 424.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="812.0" y="408.0" text-anchor="end" dominant-baseline="central" class="mono">UHBR20→13.5→10→HBR3</text><g id="edge-stop"><line x1="668.0" y1="594.0" x2="668.0" y2="690.0" fill="none" stroke="var(--status-warn)" stroke-width="2" marker-end="url(#arrow)"/><text x="790.0" y="642.0" text-anchor="middle" dominant-baseline="central" class="secondary">全部失敗</text></g><g id="note-onehot"><rect x="28" y="778" width="804" height="24" rx="6" fill="var(--bg-code)" stroke="var(--border-color)" stroke-width="1"/><text x="430.0" y="790.0" text-anchor="middle" dominant-baseline="central" class="secondary">0xF0002 是 one-hot，不是二進位數量。非法型樣不當成顆數。同 config 重試 1～2 次，次數受 CDF 控制。</text></g>
</svg>
