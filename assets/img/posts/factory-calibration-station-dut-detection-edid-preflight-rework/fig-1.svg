<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 860" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 1．預檢與 DDC／CI 寫入失敗時的 rework 流程</title>
<desc>掛載、EDID、DDC／CI 任一關失敗就標記對應 rework，跳到下一個 DUT，再回到掛載檢測。連續 3 次寫入失敗才算 DDC／CI 失敗。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="start"><rect x="96.0" y="24.0" width="180.0" height="48.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="186.0" y="48.0" text-anchor="middle" dominant-baseline="central">開始</text></g><g id="decision-dut"><rect x="36.0" y="100.0" width="300.0" height="68.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="186.0" y="134.0" text-anchor="middle" dominant-baseline="central">DUT 掛載檢測</text></g><g id="rework-dut"><rect x="470.0" y="100.0" width="300.0" height="68.0" rx="6" fill="var(--bg-highlight)" stroke="var(--status-warn)" stroke-width="1.5"/><text x="620.0" y="125.0" text-anchor="middle" dominant-baseline="central">標記 rework</text><text x="620.0" y="143.0" text-anchor="middle" dominant-baseline="central" class="mono">DUT_presence_check</text></g><g id="fail-dut"><line x1="336.0" y1="134.0" x2="470.0" y2="134.0" fill="none" stroke="var(--status-warn)" stroke-width="2" marker-end="url(#arrow)"/><text x="403.0" y="118.0" text-anchor="middle" dominant-baseline="central" class="secondary">失敗</text></g><g id="decision-edid"><rect x="36.0" y="220.0" width="300.0" height="68.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="186.0" y="254.0" text-anchor="middle" dominant-baseline="central">EDID 前置檢查</text></g><g id="rework-edid"><rect x="470.0" y="220.0" width="300.0" height="68.0" rx="6" fill="var(--bg-highlight)" stroke="var(--status-warn)" stroke-width="1.5"/><text x="620.0" y="245.0" text-anchor="middle" dominant-baseline="central">標記 rework</text><text x="620.0" y="263.0" text-anchor="middle" dominant-baseline="central" class="mono">EDID_preflight_check</text></g><g id="fail-edid"><line x1="336.0" y1="254.0" x2="470.0" y2="254.0" fill="none" stroke="var(--status-warn)" stroke-width="2" marker-end="url(#arrow)"/><text x="403.0" y="238.0" text-anchor="middle" dominant-baseline="central" class="secondary">失敗</text></g><g id="decision-ddc"><rect x="36.0" y="340.0" width="300.0" height="68.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="186.0" y="374.0" text-anchor="middle" dominant-baseline="central">DDC／CI 寫入測試</text></g><g id="rework-ddc"><rect x="470.0" y="340.0" width="300.0" height="68.0" rx="6" fill="var(--bg-highlight)" stroke="var(--status-warn)" stroke-width="1.5"/><text x="620.0" y="365.0" text-anchor="middle" dominant-baseline="central">標記 rework</text><text x="620.0" y="383.0" text-anchor="middle" dominant-baseline="central" class="mono">DDC/CI_write_timeout</text></g><g id="fail-ddc"><line x1="336.0" y1="374.0" x2="470.0" y2="374.0" fill="none" stroke="var(--status-warn)" stroke-width="2" marker-end="url(#arrow)"/><text x="403.0" y="358.0" text-anchor="middle" dominant-baseline="central" class="secondary">連續 3 次失敗</text></g><g id="to-dut"><line x1="186.0" y1="72.0" x2="186.0" y2="100.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="ok-dut"><line x1="186.0" y1="168.0" x2="186.0" y2="220.0" fill="none" stroke="var(--status-ok)" stroke-width="2" marker-end="url(#arrow)"/><text x="214.0" y="194.0" text-anchor="middle" dominant-baseline="central" class="secondary">成功</text></g><g id="ok-edid"><line x1="186.0" y1="288.0" x2="186.0" y2="340.0" fill="none" stroke="var(--status-ok)" stroke-width="2" marker-end="url(#arrow)"/><text x="214.0" y="314.0" text-anchor="middle" dominant-baseline="central" class="secondary">成功</text></g><g id="ok-ddc"><line x1="186.0" y1="408.0" x2="186.0" y2="470.0" fill="none" stroke="var(--status-ok)" stroke-width="2" marker-end="url(#arrow)"/><text x="214.0" y="438.0" text-anchor="middle" dominant-baseline="central" class="secondary">成功</text></g><g id="pass"><rect x="36.0" y="470.0" width="300.0" height="68.0" rx="6" fill="var(--bg-node)" stroke="var(--status-ok)" stroke-width="1.5"/><text x="186.0" y="504.0" text-anchor="middle" dominant-baseline="central">校正通過，進入下一階段</text></g><g id="rework-merge"><path d="M 770.0 134.0 L 800.0 134.0 L 800.0 620.0 L 620.0 620.0" fill="none" stroke="var(--status-warn)" stroke-width="2" marker-end="url(#arrow)"/><path d="M 770.0 254.0 L 800.0 254.0" fill="none" stroke="var(--status-warn)" stroke-width="2"/><path d="M 770.0 374.0 L 800.0 374.0" fill="none" stroke="var(--status-warn)" stroke-width="2"/></g><g id="skip"><rect x="470.0" y="640.0" width="300.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="620.0" y="668.0" text-anchor="middle" dominant-baseline="central">跳至下一個 DUT</text></g><g id="next"><rect x="470.0" y="736.0" width="300.0" height="56.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="620.0" y="764.0" text-anchor="middle" dominant-baseline="central">下一個 DUT</text></g><g id="to-next"><line x1="620.0" y1="696.0" x2="620.0" y2="736.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="loop-next"><path d="M 470.0 764.0 L 24.0 764.0 L 24.0 134.0 L 36.0 134.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="180.0" y="748.0" text-anchor="middle" dominant-baseline="central" class="secondary">回到掛載檢測</text></g>
</svg>
