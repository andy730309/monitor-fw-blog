<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 1．MST daisy chain 的連接方式</title>
<desc>PC 進螢幕 A。螢幕 A 是 branch，把自己的畫面留下，並從 DP OUT 接到螢幕 B。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="node-pc"><rect x="28.0" y="96.0" width="190.0" height="80.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="123.0" y="127.0" text-anchor="middle" dominant-baseline="central">PC（source）</text><text x="123.0" y="145.0" text-anchor="middle" dominant-baseline="central">拓樸管理</text></g><g id="node-a"><rect x="310.0" y="78.0" width="230.0" height="112.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="425.0" y="116.0" text-anchor="middle" dominant-baseline="central">螢幕 A（branch）</text><text x="425.0" y="134.0" text-anchor="middle" dominant-baseline="central">自己的畫面＋總機</text><text x="425.0" y="152.0" text-anchor="middle" dominant-baseline="central">sideband 收發</text></g><g id="node-b"><rect x="630.0" y="96.0" width="164.0" height="80.0" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="712.0" y="127.0" text-anchor="middle" dominant-baseline="central">螢幕 B（sink）</text><text x="712.0" y="145.0" text-anchor="middle" dominant-baseline="central">第二台</text></g><g id="link-main"><g id="wire-main"><line x1="218.0" y1="124.0" x2="310.0" y2="124.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><text x="264.0" y="108.0" text-anchor="middle" dominant-baseline="central" class="secondary">Main Link</text></g><g id="link-aux"><g id="wire-aux"><line x1="218.0" y1="152.0" x2="310.0" y2="152.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="264.0" y="170.0" text-anchor="middle" dominant-baseline="central" class="secondary">AUX（控制）</text></g></g><text x="264.0" y="196.0" text-anchor="middle" dominant-baseline="central" class="secondary">DP cable</text><g id="link-out"><line x1="540.0" y1="134.0" x2="630.0" y2="134.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="585.0" y="121.0" text-anchor="middle" dominant-baseline="central" class="secondary">DP OUT</text></g>
</svg>
