<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" role="img" style="width: 100%; height: auto; max-width: 820px; display: block; margin: 1.5rem auto;">
<title>圖 2．sideband 請求、回覆與 HPD 門鈴</title>
<desc>請求寫 0x1000。整筆回覆寫入 0x1400 並置 0x2003 bit4 之後，才送 0.5～1 ms 的 HPD 門鈴。超過 2 ms 視為拔線。</desc>
<style>
  svg {
    --bg-canvas: transparent;
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg-node: #161b22;
      --bg-code: #161b22;
      --bg-highlight: #5c4a00;
      --text-primary: #e6e8eb;
      --text-secondary: #9aa4af;
      --accent-primary: #58a6ff;
      --border-color: #2d333b;
      --status-ok: #2da44e;
      --status-warn: #f85149;
    }
  }
  :is(.dark, [data-theme="dark"]) svg {
    --bg-node: #161b22;
    --bg-code: #161b22;
    --bg-highlight: #5c4a00;
    --text-primary: #e6e8eb;
    --text-secondary: #9aa4af;
    --accent-primary: #58a6ff;
    --border-color: #2d333b;
    --status-ok: #2da44e;
    --status-warn: #f85149;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  text { font-size: 14px; fill: var(--text-primary); }
  .mono { font-size: 13px; }
  .secondary { fill: var(--text-secondary); }
  .accent { fill: var(--accent-primary); }
  .ok { fill: var(--status-ok); }
  .warn { fill: var(--status-warn); }
  :is(.light, [data-theme="light"]) svg {
    --bg-node: #f4f6f8;
    --bg-code: #f6f8fa;
    --bg-highlight: #fff3bf;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --accent-primary: #0969da;
    --border-color: #d8dee4;
    --status-ok: #2da44e;
    --status-warn: #cf222e;
  }

</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.2 L9 5 L0 8.8 Z" fill="var(--accent-primary)" style="fill:context-stroke"/></marker></defs>
<g id="frames"></g><g id="lifelines"><line x1="217.0" y1="62.0" x2="217.0" y2="308.0" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="603.0" y1="62.0" x2="603.0" y2="308.0" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4 4"/></g><g id="actor-pc"><rect x="32.0" y="24.0" width="370.0" height="38.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="217.0" y="43.0" text-anchor="middle" dominant-baseline="central">PC（source）</text></g><g id="actor-a"><rect x="418.0" y="24.0" width="370.0" height="38.0" rx="6" fill="var(--bg-node)" stroke="var(--accent-primary)" stroke-width="1.5"/><text x="603.0" y="43.0" text-anchor="middle" dominant-baseline="central">螢幕 A（branch）</text></g><g id="msg-0"><line x1="225.0" y1="120.0" x2="595.0" y2="120.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="410.0" y="98.0" text-anchor="middle" dominant-baseline="central" class="mono">寫 0x1000 請求</text></g><g id="self-1"><text x="603.0" y="154.0" text-anchor="middle" dominant-baseline="central">整筆回覆寫完，置 0x2003 bit4</text><path d="M 603.0 180.0 C 649.0 190.0, 649.0 208.0, 603.0 202.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/></g><g id="msg-2"><line x1="595.0" y1="236.0" x2="225.0" y2="236.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="410.0" y="214.0" text-anchor="middle" dominant-baseline="central" class="mono">HPD 門鈴（0.5～1 ms）</text></g><g id="msg-3"><line x1="225.0" y1="292.0" x2="595.0" y2="292.0" fill="none" stroke="var(--accent-primary)" stroke-width="2" marker-end="url(#arrow)"/><text x="410.0" y="270.0" text-anchor="middle" dominant-baseline="central" class="mono">讀 0x1400 回覆</text></g><g id="waveform-hpd"><rect x="24" y="324.0" width="772" height="132" rx="6" fill="var(--bg-node)" stroke="var(--border-color)" stroke-width="1.5"/><text x="48.0" y="342.0" text-anchor="start" dominant-baseline="central" class="mono">IRQ HPD</text><path d="M 160.0 378.0 L 300.0 378.0 L 300.0 410.0 L 460.0 410.0 L 460.0 378.0 L 760.0 378.0" fill="none" stroke="var(--accent-primary)" stroke-width="2"/><line x1="300" y1="430.0" x2="460" y2="430.0" stroke="var(--border-color)" stroke-width="1.5"/><text x="380.0" y="444.0" text-anchor="middle" dominant-baseline="central" class="mono">0.5～1 ms</text><text x="620.0" y="430.0" text-anchor="middle" dominant-baseline="central" class="warn">超過 2 ms 視為拔線</text></g>
</svg>
